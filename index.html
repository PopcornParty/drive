<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Turbo Lanes</title>
  <style>
    :root {
      --bg: #0b1020;
      --road: #2a2f3d;
      --line: #f4e27a;
      --accent: #7cffb2;
      --danger: #ff5d7a;
      --gold: #ffd166;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
    html, body {
      width: 100%; height: 100%;
      height: 100dvh;
      background: radial-gradient(ellipse at top, #1a2450 0%, var(--bg) 55%);
      overflow: hidden;
      font-family: "Trebuchet MS", "Segoe UI", system-ui, sans-serif;
      color: #fff;
      touch-action: none;
      overscroll-behavior: none;
    }
    #wrap {
      position: relative;
      width: 100%; height: 100%;
      height: 100dvh;
      display: flex; align-items: center; justify-content: center;
    }
    canvas {
      display: block;
      width: min(100vw, calc(100dvh * 420 / 720));
      height: min(100dvh, calc(100vw * 720 / 420));
      max-width: 100%; max-height: 100%;
      background: #111;
      box-shadow: 0 0 80px rgba(124, 255, 178, 0.12);
      border-radius: 8px;
      touch-action: none;
    }
    #hud {
      position: absolute; inset: 0;
      pointer-events: none;
      display: flex; flex-direction: column;
    }
    #topbar {
      display: flex; justify-content: space-between; align-items: flex-start;
      padding: 14px 18px;
      text-shadow: 0 2px 8px #000;
      gap: 8px;
    }
    .stat { font-size: 13px; letter-spacing: 0.5px; opacity: 0.95; }
    .stat b { color: var(--gold); font-size: 18px; }
    #combo {
      text-align: center; font-size: 22px; font-weight: 800;
      color: var(--accent);
      text-shadow: 0 0 16px rgba(124,255,178,0.6);
      min-height: 28px;
    }
    #overlay {
      position: absolute; inset: 0;
      display: flex; align-items: center; justify-content: center;
      background: rgba(6, 8, 18, 0.72);
      backdrop-filter: blur(6px);
      pointer-events: auto;
    }
    #overlay.hidden { display: none; }
    .panel {
      text-align: center;
      padding: 28px 32px;
      max-width: 420px;
    }
    h1 {
      font-size: 42px;
      letter-spacing: 2px;
      background: linear-gradient(180deg, #fff 20%, var(--accent));
      -webkit-background-clip: text; background-clip: text; color: transparent;
      filter: drop-shadow(0 4px 0 #0a3);
      margin-bottom: 8px;
    }
    .sub { opacity: 0.8; margin-bottom: 22px; line-height: 1.45; }
    button {
      pointer-events: auto;
      border: 0; cursor: pointer;
      background: linear-gradient(180deg, #9dffc8, #2ee08a);
      color: #062814;
      font-weight: 800; font-size: 18px;
      padding: 12px 28px;
      border-radius: 999px;
      box-shadow: 0 6px 0 #178a52, 0 12px 24px rgba(0,0,0,0.35);
      transition: transform 0.08s ease;
    }
    button:active { transform: translateY(4px); box-shadow: 0 2px 0 #178a52; }
    .keys { margin-top: 18px; font-size: 13px; opacity: 0.75; }
    kbd {
      display: inline-block;
      background: #1c2438; border: 1px solid #3a4564;
      padding: 2px 7px; border-radius: 5px; margin: 0 2px;
    }
    #go-title { font-size: 34px; color: var(--danger); margin-bottom: 6px; }
    #go-score { font-size: 18px; margin: 10px 0 18px; }
    #controls {
      position: absolute; left: 0; right: 0;
      bottom: max(16px, env(safe-area-inset-bottom));
      display: none;
      justify-content: center;
      gap: 16px;
      pointer-events: none;
      z-index: 5;
    }
    #controls.show { display: flex; }
    #controls button {
      pointer-events: auto;
      width: 86px; height: 86px;
      border-radius: 22px;
      font-size: 30px;
      padding: 0;
      background: rgba(255,255,255,0.2);
      color: #fff;
      box-shadow: 0 4px 0 rgba(0,0,0,0.35);
      border: 2px solid rgba(255,255,255,0.28);
      touch-action: manipulation;
    }
    #controls button:active { transform: translateY(3px); }
    #boost-btn { width: 100px !important; background: rgba(124,255,178,0.32) !important; }
    @media (max-width: 520px) {
      h1 { font-size: 32px; }
      .panel { padding: 18px 16px; width: min(420px, 96vw); }
      button { font-size: 16px; padding: 14px 20px; min-height: 48px; }
      #topbar { padding: 10px 12px; padding-top: max(10px, env(safe-area-inset-top)); }
      .stat b { font-size: 16px; }
    }
    #overlay { z-index: 8; cursor: default; }
    button { position: relative; z-index: 9; }
    .row-btns { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-top: 8px; }
    .ghost {
      background: linear-gradient(180deg, #d7e0ff, #8ea2e8) !important;
      color: #12183a !important;
      box-shadow: 0 6px 0 #4d5ea8, 0 12px 24px rgba(0,0,0,0.35) !important;
    }
    .ghost:active { box-shadow: 0 2px 0 #4d5ea8 !important; }
    #shop-panel { display: none; width: min(420px, 94vw); max-height: 86vh; overflow: auto; }
    #shop-panel h2 { margin-bottom: 4px; letter-spacing: 1px; }
    #shop-bank { color: var(--gold); font-weight: 800; margin-bottom: 12px; }
    #shop-msg { min-height: 18px; font-size: 13px; color: var(--accent); margin-bottom: 8px; }
    .shop-sec { text-align: left; margin: 10px 0 6px; font-size: 13px; opacity: 0.75; letter-spacing: 1px; }
    .shop-tabs { display: flex; gap: 8px; justify-content: center; margin: 10px 0 8px; }
    .shop-tabs button {
      flex: 1; padding: 10px 8px; font-size: 14px; min-height: 44px;
      background: rgba(255,255,255,0.1) !important;
      color: #fff !important;
      box-shadow: 0 3px 0 rgba(0,0,0,0.3) !important;
    }
    .shop-tabs button.on {
      background: linear-gradient(180deg, #9dffc8, #2ee08a) !important;
      color: #062814 !important;
      box-shadow: 0 3px 0 #178a52 !important;
    }
    .shop-pane { display: none; }
    .shop-pane.on { display: block; }
    .shop-item {
      display: flex; align-items: center; gap: 10px;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 12px;
      padding: 8px 10px;
      margin-bottom: 8px;
      cursor: pointer;
    }
    .shop-item:hover { background: rgba(255,255,255,0.12); }
    .shop-item.owned { border-color: rgba(124,255,178,0.35); }
    .shop-item.selected { outline: 2px solid var(--accent); }
    .swatch {
      width: 28px; height: 36px; border-radius: 7px; flex: 0 0 auto;
      box-shadow: inset 0 -8px 0 rgba(0,0,0,0.2), 0 2px 0 rgba(0,0,0,0.3);
    }
    .shop-item .info { flex: 1; text-align: left; }
    .shop-item .info b { display: block; font-size: 14px; }
    .shop-item .info span { font-size: 12px; opacity: 0.75; }
    .price {
      font-weight: 800; color: var(--gold); font-size: 13px; white-space: nowrap;
    }
    .board {
      margin: 14px auto 0;
      width: 100%;
      max-width: 280px;
      text-align: left;
    }
    .board h3 {
      font-size: 12px;
      letter-spacing: 2px;
      opacity: 0.7;
      text-align: center;
      margin-bottom: 6px;
    }
    .board-row {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 5px 8px;
      border-radius: 8px;
      background: rgba(255,255,255,0.05);
      margin-bottom: 4px;
      font-size: 14px;
    }
    .board-row .pos { width: 22px; font-weight: 800; color: var(--gold); }
    .board-row .who { flex: 1; letter-spacing: 3px; font-weight: 800; }
    .board-row .pts { color: var(--gold); font-weight: 800; }
    #name-panel { display: none; }
    .letters {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin: 16px 0 12px;
    }
    .letter-col { display: flex; flex-direction: column; align-items: center; gap: 4px; }
    .letter-col button {
      width: 46px; height: 28px; padding: 0; font-size: 14px;
      box-shadow: 0 3px 0 #178a52;
      border-radius: 8px;
    }
    .letter-box {
      width: 54px; height: 64px;
      border-radius: 12px;
      background: #1c2438;
      border: 2px solid #3a4564;
      font-size: 36px;
      font-weight: 800;
      letter-spacing: 0;
      display: flex; align-items: center; justify-content: center;
    }
    .letter-box.on { border-color: var(--accent); box-shadow: 0 0 12px rgba(124,255,178,0.35); }
    #daily-btn.ready { background: linear-gradient(180deg, #ffe08a, #ffd166) !important; color: #3a2a00 !important; box-shadow: 0 6px 0 #c79212, 0 12px 24px rgba(0,0,0,0.35) !important; }
    .rank-wrap { margin: 10px auto 8px; width: 100%; max-width: 280px; text-align: left; }
    .rank-lab { display: flex; justify-content: space-between; font-size: 12px; margin-bottom: 4px; }
    .rank-bar { height: 10px; background: rgba(255,255,255,0.12); border-radius: 99px; overflow: hidden; }
    .rank-bar > i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, #7cffb2, #ffd166); border-radius: 99px; }
    #garage-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 8px; }
    .gar-card {
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 12px;
      padding: 10px 8px;
      cursor: pointer;
      text-align: center;
    }
    .gar-card.selected { outline: 2px solid var(--accent); }
    .gar-card .swatch { margin: 0 auto 6px; width: 36px; height: 46px; }
    .gar-card b { display: block; font-size: 13px; }
    .gar-card span { font-size: 11px; opacity: 0.75; }
    #music-btn {
      position: absolute; top: 10px; right: 10px; z-index: 12;
      width: 44px; height: 44px; padding: 0;
      border-radius: 12px;
      font-size: 20px;
      background: rgba(255,255,255,0.14) !important;
      color: #fff !important;
      box-shadow: 0 3px 0 rgba(0,0,0,0.35) !important;
      border: 2px solid rgba(255,255,255,0.2);
    }
  </style>
</head>
<body>
  <div id="wrap">
    <canvas id="c" width="420" height="720"></canvas>
    <div id="hud">
      <div id="topbar">
        <div class="stat">SCORE<br><b id="score">0</b></div>
        <div class="stat" style="text-align:center">SPEED<br><b id="spd">0</b></div>
        <div class="stat" style="text-align:center">BANK<br><b id="bank">0</b></div>
        <div class="stat" style="text-align:right">BEST<br><b id="best">0</b></div>
      </div>
      <div id="combo"></div>
    </div>

    <div id="overlay">
      <div class="panel" id="start-panel">
        <h1>TURBO LANES</h1>
        <p class="sub">Race, upgrade, and climb the ranks.<br>How far can you go today?</p>
        <div class="row-btns">
          <button type="button" id="play-btn">START ENGINE</button>
          <button type="button" id="shop-btn" class="ghost">SHOP</button>
          <button type="button" id="stats-btn" class="ghost">STATS</button>
          <button type="button" id="garage-btn" class="ghost">GARAGE</button>
        </div>
        <div class="row-btns">
          <button type="button" id="daily-btn" class="ghost">DAILY BONUS</button>
        </div>
        <p class="keys" id="menu-stats"></p>
        <div class="rank-wrap" id="rank-menu"></div>
        <div class="board" id="board-menu"></div>
        <div class="board" id="board-world-menu"></div>
      </div>

      <div class="panel" id="go-panel" style="display:none">
        <div id="go-title">CRASH!</div>
        <div id="go-score"></div>
        <div class="rank-wrap" id="rank-go"></div>
        <div class="board" id="board-go"></div>
        <div class="board" id="board-world-go"></div>
        <div class="row-btns">
          <button type="button" id="retry-btn">RACE AGAIN</button>
          <button type="button" id="home-btn" class="ghost">HOME</button>
        </div>
        <div class="row-btns">
          <button type="button" id="shop-btn-go" class="ghost">SHOP</button>
          <button type="button" id="stats-btn-go" class="ghost">STATS</button>
        </div>
      </div>

      <div class="panel" id="name-panel">
        <h2>NEW HIGH SCORE</h2>
        <p class="sub" id="name-score-line">Enter a 3-letter name</p>
        <div class="letters">
          <div class="letter-col">
            <button type="button" data-slot="0" data-dir="1">▲</button>
            <div class="letter-box on" id="let0">A</div>
            <button type="button" data-slot="0" data-dir="-1">▼</button>
          </div>
          <div class="letter-col">
            <button type="button" data-slot="1" data-dir="1">▲</button>
            <div class="letter-box" id="let1">A</div>
            <button type="button" data-slot="1" data-dir="-1">▼</button>
          </div>
          <div class="letter-col">
            <button type="button" data-slot="2" data-dir="1">▲</button>
            <div class="letter-box" id="let2">A</div>
            <button type="button" data-slot="2" data-dir="-1">▼</button>
          </div>
        </div>
        <button type="button" id="name-save">SAVE NAME</button>
      </div>

      <div class="panel" id="shop-panel">
        <h2>PIT STOP SHOP</h2>
        <div id="shop-bank">Bank: 0</div>
        <div id="shop-msg"></div>
        <div class="shop-tabs">
          <button type="button" id="tab-upg" class="on">UPGRADES</button>
          <button type="button" id="tab-skins">SKINS</button>
        </div>

        <div class="shop-pane on" id="pane-upg">
          <div class="shop-sec">BANK BOOST</div>
          <div id="shop-mult"></div>
          <div class="shop-sec">RACE UPGRADES</div>
          <div id="shop-upgrades"></div>
        </div>

        <div class="shop-pane" id="pane-skins">
          <div class="shop-sec">CAR SKINS</div>
          <div id="shop-skins"></div>
        </div>

        <div class="row-btns" style="margin-top:14px">
          <button type="button" id="shop-back" class="ghost">BACK</button>
        </div>
      </div>

      <div class="panel" id="stats-panel" style="display:none;width:min(420px,94vw);max-height:86vh;overflow:auto">
        <h2>DRIVER STATS</h2>
        <div id="stats-list" class="board"></div>
        <div class="shop-sec">ADMIN CODE</div>
        <div style="display:flex;gap:8px;margin:8px 0 4px">
          <input id="code-in" maxlength="16" placeholder="Enter code" autocomplete="off" spellcheck="false"
            style="flex:1;border:0;border-radius:10px;padding:10px 12px;background:#1c2438;color:#fff;font-weight:800;letter-spacing:1px" />
          <button type="button" id="code-go" class="ghost" style="padding:10px 16px">OK</button>
        </div>
        <div id="code-msg" style="min-height:18px;font-size:13px;color:var(--accent)"></div>
        <div class="row-btns" style="margin-top:14px">
          <button type="button" id="stats-back" class="ghost">BACK</button>
        </div>
      </div>

      <div class="panel" id="garage-panel" style="display:none;width:min(420px,94vw);max-height:86vh;overflow:auto">
        <h2>GARAGE</h2>
        <p class="sub" id="garage-sub">Tap a car you own to drive it.</p>
        <div id="garage-grid"></div>
        <div class="row-btns" style="margin-top:14px">
          <button type="button" id="garage-back" class="ghost">BACK</button>
        </div>
      </div>
    </div>

    <div id="controls">
      <button type="button" id="left-btn">◀</button>
      <button type="button" id="boost-btn">▲</button>
      <button type="button" id="right-btn">▶</button>
    </div>

    <button type="button" id="music-btn" title="Music on/off">♪</button>
  </div>

<script>
(() => {
  const canvas = document.getElementById("c");
  const ctx = canvas.getContext("2d");
  const W = canvas.width, H = canvas.height;

  const overlay = document.getElementById("overlay");
  const startPanel = document.getElementById("start-panel");
  const goPanel = document.getElementById("go-panel");
  const scoreEl = document.getElementById("score");
  const bestEl = document.getElementById("best");
  const comboEl = document.getElementById("combo");
  const goScore = document.getElementById("go-score");

  const LANES = 4;
  const ROAD_L = 56, ROAD_R = W - 56;
  const ROAD_W = ROAD_R - ROAD_L;
  const LANE_W = ROAD_W / LANES;
  const laneX = (i) => ROAD_L + LANE_W * (i + 0.5);

  const CAR_COLORS = ["#ff5d7a", "#ffd166", "#4cc9f0", "#c77dff", "#ff9f1c", "#00bbf9", "#f72585"];

  const SKINS = [
    { id: "starter", name: "Mint", color: "#7cffb2", stripe: "#ffffff", price: 0 },
    { id: "ruby", name: "Ruby", color: "#ff4d6d", stripe: "#ffffff", price: 400 },
    { id: "sunny", name: "Sunny", color: "#ffd166", stripe: "#ffffff", price: 1200 },
    { id: "sky", name: "Sky", color: "#4cc9f0", stripe: "#ffffff", price: 3500 },
    { id: "grape", name: "Grape", color: "#c77dff", stripe: "#ffffff", price: 10000 },
    { id: "tiger", name: "Tiger", color: "#ff9f1c", stripe: "#3d2b1f", price: 35000 },
    { id: "shadow", name: "Shadow", color: "#2b2d42", stripe: "#ffd166", price: 150000 },
    { id: "rainbow", name: "Rainbow", color: "rainbow", stripe: "#ffffff", price: 1000000 },
  ];

  const MAX_MULT_LV = 40;
  const SAVE_KEY = "turboLanesSave";

  function multCost(level) {
    return Math.floor(400 * Math.pow(2.15, level));
  }

  function formatPts(n) {
    return Math.floor(n).toLocaleString("en-US");
  }

  function isRich() {
    return !!(save && save.infinite);
  }

  function formatBank() {
    return isRich() ? "∞" : formatPts(save.bank);
  }

  function canPay(n) {
    return isRich() || save.bank >= n;
  }

  function pay(n) {
    if (!isRich()) {
      save.bank -= n;
      save.stats.spent += n;
    }
  }

  function nextSkinGoal() {
    const locked = SKINS.find(s => s.price > 0 && !(save.owned || []).includes(s.id));
    if (!locked) return "Every skin unlocked";
    if (isRich() || save.bank >= locked.price) return locked.name + " is ready in the shop";
    return formatPts(locked.price - save.bank) + " to " + locked.name;
  }

  function rankInfo() {
    const pts = (save.stats && save.stats.earned) || 0;

    const tiers = [
      [0, "Bronze I"],
      [1500, "Bronze II"],
      [4000, "Bronze III"],
      [8000, "Silver I"],
      [14000, "Silver II"],
      [22000, "Silver III"],
      [32000, "Gold I"],
      [48000, "Gold II"],
      [70000, "Gold III"],
      [100000, "Platinum I"],
      [140000, "Platinum II"],
      [190000, "Platinum III"],
      [260000, "Diamond I"],
      [340000, "Diamond II"],
      [440000, "Diamond III"],
      [560000, "Elite"],
      [720000, "Champion"],
      [1000000, "Unreal"],
    ];

    let name = "Bronze I", next = 1200, i = 0, floor = 0;

    for (let t = 0; t < tiers.length; t++) {
      if (pts >= tiers[t][0]) {
        name = tiers[t][1];
        i = t;
        floor = tiers[t][0];
      }
    }

    next = tiers[i + 1] ? tiers[i + 1][0] : null;
    const nextName = tiers[i + 1] ? tiers[i + 1][1] : "";
    const span = (next || floor + 1) - floor;
    const into = pts - floor;
    const pct = next ? Math.max(0, Math.min(1, into / span)) : 1;

    return {
      name,
      next,
      nextName,
      pts,
      i,
      floor,
      pct,
      left: next ? next - pts : 0
    };
  }

  function renderRankBar(id, extra) {
    const el = document.getElementById(id);
    if (!el) return;

    const r = rankInfo();
    const right = r.next ? formatPts(r.left) + " to next" : "MAX";

    el.innerHTML =
      `<div class="rank-lab"><b style="color:var(--accent)">${r.name}</b><span>${right}</span></div>
      <div class="rank-bar"><i style="width:${Math.floor(r.pct * 100)}%"></i></div>
      ${extra ? `<div style="margin-top:6px;font-size:13px;color:var(--gold)">${extra}</div>` : ""}`;
  }

  function loadSave() {
    try {
      const raw = localStorage.getItem(SAVE_KEY);

      if (raw) {
        const s = JSON.parse(raw);

        return {
          bank: Math.max(0, Number(s.bank) || 0),
          best: Math.max(0, Number(s.best) || Number(localStorage.getItem("turboLanesBest") || 0)),
          multLv: clamp(Number(s.multLv) || 0, 0, MAX_MULT_LV),
          owned: Array.isArray(s.owned) && s.owned.length ? s.owned : ["starter"],
          skin: s.skin || "starter",
          board: cleanBoard(s.board),
          stats: mergeStats(s.stats),
          codes: Array.isArray(s.codes) ? s.codes : [],
          dailyLast: s.dailyLast || "",
          dailyStreak: Math.max(0, Number(s.dailyStreak) || 0),
          upg: mergeUpg(s.upg),
          infinite: !!s.infinite,
        };
      }
    } catch (e) {}

    return {
      bank: 0,
      best: Number(localStorage.getItem("turboLanesBest") || 0),
      multLv: 0,
      owned: ["starter"],
      skin: "starter",
      board: [],
      stats: mergeStats(null),
      codes: [],
      dailyLast: "",
      dailyStreak: 0,
      upg: mergeUpg(null),
      infinite: false,
    };
  }

  function persist() {
    localStorage.setItem(SAVE_KEY, JSON.stringify(save));
    localStorage.setItem("turboLanesBest", String(save.best));
  }

  function todayISO() {
    const d = new Date();
    return d.getFullYear() + "-" +

  function degFreq(deg, oct, root) {
    if (deg < 0) return 0;

    const major = [0, 2, 4, 5, 7, 9, 11];

    const st =
      major[deg % 7] +
      12 * Math.floor(deg / 7) +
      (oct || 0) * 12;

    return (root || 174.61) *
      Math.pow(2, st / 12);
  }

  function pickSong(avoid) {
    if (SONGS.length < 2) return 0;

    return i;
  }

  function tone(freq, dur, type, vol, when) {
    if (!freq || !musicOn) return;

    try {
      const a = audio();
      const t = when || a.currentTime;

      const o = a.createOscillator();
      const g = a.createGain();

      o.type = type;
      o.frequency.setValueAtTime(freq, t);

      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(
        vol,
        t + 0.02
      );
      g.gain.exponentialRampToValueAtTime(
        0.0001,
        t + dur
      );

      o.connect(g);
      g.connect(a.destination);

      o.start(t);
      o.stop(t + dur + 0.02);
    } catch (e) {}
  }

  function startMusic() {
    music.playing = true;

  function stopMusic() {

  function tickMusic() {
    if (!music.playing || !musicOn) return;

    try {
      const a = audio();
      const now = a.currentTime;

      const song = SONGS[music.song] || SONGS[0];

      while (music.next < now + 0.25) {
        if (music.step >= song.melody.length) {
          music.song = pickSong(music.song);
          music.step = 0;
        }

        const track = SONGS[music.song];
        const i = music.step;

        const m = track.melody[i];
        const b = track.bass[i % track.bass.length];

        if (m >= 0) {
          tone(
            degFreq(m, 1, track.root),
            track.beat * 1.4,
            "sine",
            0.042,
            music.next
          );

          tone(
            degFreq(m, 1, track.root) * 2,
            track.beat,
            "triangle",
            0.01,
            music.next
          );
        }

        if (b >= 0) {
          tone(
            degFreq(b, 0, track.root),
            track.beat * 2.1,
            "sine",
            0.028,
            music.next
          );

          tone(
            degFreq(b + 4, 0, track.root),
            track.beat * 1.8,
            "sine",
            0.01,
            music.next
          );
        }

        music.step += 1;
        music.next += track.beat;
      }
    } catch (e) {}
  }

      "bush",
      "rock",
      "sign",
      "lamp",
      "flower"
    ];

    state.trees = [];

    for (let i = 0; i < 22; i++) {
      state.trees.push({
        side: i % 2,
        y: (i / 22) * H * 1.25 - 50,
        s: rand(0.7, 1.25),
        hue: rand(90, 150),
        kind: KINDS[(Math.random() * KINDS.length) | 0],
      });
    }

    scoreEl.textContent = "0";
    comboEl.textContent = "";
  }

  function freeLanes(maxY) {
    const used = new Set(
      state.cars
        .filter(c => c.y < maxY)
        .map(c => c.lane)
    );

    const free = [];

    for (let i = 0; i < LANES; i++) {
      if (!used.has(i)) free.push(i);
    }

    return free;
  }

  function spawnCar(opts) {
    opts = opts || {};

    const free = freeLanes(opts.maxY || 160);

    if (!free.length) return;

    const lane =
      opts.lane != null
        ? opts.lane
        : pick(free);

    if (!free.includes(lane) && opts.lane == null) return;

    const roll = Math.random();

    let w = 34;
    let h = 54;
    let vyMul = rand(0.35, 0.72);

    if (roll > 0.88) {
      w = 42;
      h = 78;
      vyMul = rand(0.28, 0.48);
    } else if (roll > 0.72) {
      w = 36;
      h = 62;
      vyMul = rand(0.4, 0.6);
    } else if (roll < 0.18) {
      w = 28;
      h = 44;
      vyMul = rand(0.55, 0.88);
    }

    state.cars.push({
      lane,
      x: laneX(lane),
      y: opts.y != null ? opts.y : -80,
      w,
      h,
      vy: state.speed * vyMul,
      color: pick(
        CAR_COLORS.filter(c => c !== "#7cffb2")
      ),
      passed: false,
      near: false,
      wander: 0,
    });
  }

  function spawnCoin(lane, y) {
    const occupied = new Set(
      state.cars
        .filter(c => c.y < 120)
        .map(c => c.lane)
    );

    const free = [];

    for (let i = 0; i < LANES; i++) {
      if (!occupied.has(i)) free.push(i);
    }

    if (!free.length && lane == null) return;

    const ln =
      lane != null
        ? lane
        : pick(free);

    state.coins.push({
      lane: ln,
      x: laneX(ln),
      y: y != null ? y : -30,
      r: 11,
      grabbed: false,
      spin: rand(0, Math.PI),
    });
  }

  function spawnCoinLine() {
    const free = freeLanes(140);

    if (!free.length) return;

    const lane = pick(free);

    for (let i = 0; i < 2; i++) {
      spawnCoin(lane, -30 - i * 48);
    }
  }

  function laneDust(p) {
    for (let i = 0; i < 9; i++) {
      state.parts.push({
        x: p.x + rand(-12, 12),
        y: p.y + p.h * 0.38,
        vx: rand(-55, 55),
        vy: rand(30, 90),
        life: rand(0.18, 0.42),
        max: 0.42,
        size: rand(3, 7),
        color: pick([
          "#cbb89a",
          "#ddd3c4",
          "#8e877a",
          "#b7aa96"
        ]),
      });
    }
  }

  function burst(x, y, color, n, speed) {
    for (let i = 0; i < n; i++) {
      const a = rand(0, Math.PI * 2);
      const s = rand(40, speed);

      state.parts.push({
        x,
        y,
        vx: Math.cos(a) * s,
        vy: Math.sin(a) * s,
        life: rand(0.3, 0.8),
        max: 0.8,
        size: rand(2, 5),
        color,
      });
    }
  }

  function gameOver() {
    state.mode = "over";

    noiseCrash();

    burst(
      state.player.x,
      state.player.y,
      "#fff",
      28,
      320
    );

    burst(
      state.player.x,
      state.player.y,
      state.player.color,
      18,
      220
    );

    state.shake = 14;
    state.flash = 0.5;

    if (state.score > best) {
      best = state.score;

      localStorage.setItem(
        "turboLanesBest",
        String(best)
      );

      bestEl.textContent = Math.floor(best);
    }

    const run = Math.floor(state.score);

    const earned = Math.floor(
      (state.cash || 0) +
      ((state.runNear || 0) * 6 + state.t * 14) *
      multiplier()
    );

    const prevRank = rankInfo().name;

    const beatBest =
      state.newBest ||
      run > (save.best || 0);

    document.getElementById("go-title").textContent =
      beatBest ? "HIGH SCORE!" : "CRASH!";

    document.getElementById("go-title").style.color =
      beatBest
        ? "var(--gold)"
        : "var(--danger)";

    save.bank += earned;
    save.stats.races += 1;
    save.stats.earned += earned;
    save.stats.time += state.t;
    save.stats.dist += state.dist;

    if (state.score > save.best) {
      save.best = state.score;
    }

    best = save.best;

    persist();

    bestEl.textContent = Math.floor(best);

    refreshBankHud();

    const r = rankInfo();

    const rankedUp =
      r.name !== prevRank;

    const close =
      !rankedUp &&
      r.next &&
      r.nextName &&
      r.left <=
        Math.max(
          500,
          (r.next - r.floor) * 0.18
        );

    const hook =
      rankedUp
        ? "RANKED UP → " + r.name + "!"
        : (
          close
            ? "So close! " +
              formatPts(r.left) +
              " to " +
              r.nextName
            : ""
        );

    goScore.innerHTML =
      `Score posted <b style="color:var(--gold)">${formatPts(run)}</b> · Best ${formatPts(best)}<br>
      Time ${formatTime(state.t)} · Top speed ${Math.floor((state.maxSpd || 0) * 0.32)} · Coins ${state.runCoins || 0}<br>
      Money this run <b style="color:var(--gold)">+${formatPts(earned)}</b> · Bank ${formatBank()}`;

    renderRankBar(
      "rank-go",
      hook || nextSkinGoal()
    );

    startPanel.style.display = "none";

    document.getElementById("shop-panel").style.display = "none";

    overlay.classList.remove("hidden");

    document.getElementById("controls")
      .classList.remove("show");

    state.pendingScore = run;

    goPanel.style.display = "block";

    renderBoard("board-go");
    renderWorld("board-world-go");

    pullWorld().then(() => {
      if (
        boardPlace(run) >= 0 ||
        worldPlace(run) >= 0
      ) {
        showNameEntry(run);
      }
    });
  }

  function tryCode() {
    const raw =
      (
        document.getElementById("code-in")
          .value || ""
      )
        .toUpperCase()
        .replace(/[^A-Z0-9]/g, "");

    const msg =
      document.getElementById("code-msg");

    if (!raw) {
      msg.textContent =
        "Type a code first.";
      return;
    }

    if (raw === "ULTIMATE") {
      save.infinite = true;

      persist();
      refreshBankHud();
      renderStats();

      msg.textContent =
        "Infinite bank unlocked. Shop is free.";

      beep(
        660,
        0.12,
        "sine",
        0.06,
        990
      );

      document.getElementById(
        "code-in"
      ).value = "";

      return;
    }

    if (!ADMIN_CODES[raw]) {
      msg.textContent =
        "That code is not valid.";

      beep(
        180,
        0.1,
        "square",
        0.04
      );

      return;
    }

    if ((save.codes || []).includes(raw)) {
      msg.textContent =
        "You already used that code.";
      return;
    }

    const amt =
      ADMIN_CODES[raw];

    save.codes.push(raw);

    if (!isRich()) {
      save.bank += amt;
    }

    persist();
    refreshBankHud();
    renderStats();

    msg.textContent =
      "+" +
      formatPts(amt) +
      " added to your bank!";

    beep(
      660,
      0.12,
      "sine",
      0.06,
      990
    );

    document.getElementById(
      "code-in"
    ).value = "";
  }

  const keys = state.keys;

  function bindHold(el, key) {
    const down = (e) => {
      e.preventDefault();
      e.stopPropagation();
      keys[key] = true;
    };

    const up = (e) => {
      e.preventDefault();
      keys[key] = false;
    };

    el.addEventListener(
      "pointerdown",
      down

    (e) => {
      if (
        !swipeOn ||
        state.mode !== "play" ||
        !state.player
      ) {
        swipeOn = false;
        return;
      }

      swipeOn = false;

      const dx =
        e.clientX - swipeX;

      const dy =
        e.clientY - swipeY;

      if (
        Math.abs(dx) > 28 &&
        Math.abs(dx) > Math.abs(dy)
      ) {
        if (
          dx < 0 &&
          state.player.lane > 0
        ) {
          state.player.lane -= 1;
          laneDust(state.player);
        }

        if (
          dx > 0 &&
          state.player.lane <
            LANES - 1
        ) {
          state.player.lane += 1;
          laneDust(state.player);
        }
      }
    }
  );

  window.addEventListener(
    "keydown",
    (e) => {
      if (state.mode === "name") {
        if (e.code === "ArrowLeft") {
          nameState.slot =
            (nameState.slot + 2) % 3;

          paintNameSlots();
          e.preventDefault();
          return;
        }

        if (e.code === "ArrowRight") {
          nameState.slot =
            (nameState.slot + 1) % 3;

          paintNameSlots();
          e.preventDefault();
          return;
        }

        if (e.code === "ArrowUp") {
          nudgeLetter(
            nameState.slot,
            1
          );

          e.preventDefault();
          return;
        }

        if (e.code === "ArrowDown") {
          nudgeLetter(
            nameState.slot,
            -1
          );

          e.preventDefault();
          return;
        }

        if (
          e.key &&
          /^[a-zA-Z0-9]$/.test(e.key)
        ) {
          nameState.letters[
            nameState.slot
          ] = e.key.toUpperCase();

          nameState.slot =
            Math.min(
              2,
              nameState.slot + 1
            );

          paintNameSlots();

          e.preventDefault();
          return;
        }

        if (e.code === "Backspace") {
          nameState.letters[
            nameState.slot
          ] = "A";

          nameState.slot =
            Math.max(
              0,
              nameState.slot - 1
            );

          paintNameSlots();

          e.preventDefault();
          return;
        }

        if (e.code === "Enter") {
          e.preventDefault();
          submitName();
          return;
        }

        return;
      }

      if (state.mode === "stats") {
        if (e.code === "Escape") {
          showMenu();
        }

        return;
      }

      if (
        state.mode === "play" &&
        (
          e.code === "KeyP" ||
          e.code === "Escape"
        )
      ) {
        e.preventDefault();

        state.paused =
          !state.paused;

        keys.l =
          keys.r =
          keys.u =
          false;

        return;
      }

      if (state.paused) {
        if (
          e.code === "Enter" ||
          e.code === "Space" ||
          e.code === "KeyP"
        ) {
          e.preventDefault();
          state.paused = false;
        }

        return;
      }

      if (
        e.code === "ArrowLeft" ||
        e.code === "KeyA"
      ) {
        keys.l = true;
      }

      if (
        e.code === "ArrowRight" ||
        e.code === "KeyD"
      ) {
        keys.r = true;
      }

      if (
        e.code === "ArrowUp" ||
        e.code === "KeyW" ||
        e.code === "Space"
      ) {
        keys.u = true;
      }

      if (
        (
          e.code === "Enter" ||
          e.code === "Space"
        ) &&
        (
          state.mode === "menu" ||
          state.mode === "over"
        )
      ) {
        e.preventDefault();
        start();
      }

      if (
        e.code === "Escape" &&
        (
          state.mode === "shop" ||
          state.mode === "stats" ||
          state.mode === "garage"
        )
      ) {
        showMenu();
      }
    }
  );

      }
    }
  );

  function update(dt) {
    tickMusic();

    state.t += dt;

    if (state.shake > 0) {
      state.shake =
        Math.max(
          0,
          state.shake - dt * 28
        );
    }

    if (state.flash > 0) {
      state.flash =
        Math.max(
          0,
          state.flash - dt * 2.2
        );
    }

    if (state.comboT > 0) {
      state.comboT -= dt;

      if (state.comboT <= 0) {
        state.combo = 0;
        comboEl.textContent = "";
      }
    }

    const scroll =
      (
        state.mode === "play"
          ? state.speed
          : 90
      ) * dt;

    for (const tr of state.trees) {
      tr.y += scroll * 0.55;

      if (tr.y > H + 50) {
        const KINDS = [
          "tree",
          "tree",
          "bush",
          "rock",
          "sign",
          "lamp",
          "flower"
        ];

        tr.y = -70;
        tr.s = rand(0.7, 1.25);
        tr.side =
          Math.random() < 0.5
            ? 0
            : 1;

        tr.kind =
          KINDS[
            (Math.random() *
              KINDS.length) | 0
          ];

        tr.hue = rand(90, 150);
      }
    }

    if (state.mode !== "play") {
      state.roadOff += 90 * dt;
      return;
    }

    if (state.paused) return;

    const p = state.player;

    if (p.inv > 0) {
      p.inv -= dt;
    }

    const heat =
      Math.max(
        0,
        Math.floor(
          state.score / 1000
        )
      );

    const calm =
      save.upg.calm || 0;

    state.baseSpeed =
      300 +
      90 *
        (
          1 -
          Math.exp(
            -state.t / 18
          )
        ) +
      Math.min(
        40,
        state.dist * 0.016
      ) +
      heat *
        Math.max(
          8,
          36 - calm * 5
        );

    const nitro =
      0.45 +
      (save.upg.nitro || 0) *
      0.08;

    if (keys.u) {
      state.boost =
        Math.min(
          1,
          state.boost +
            dt * 1.6
        );
    } else {
      state.boost =
        Math.max(
          0,
          state.boost -
            dt *
            (
              2.2 -
              (save.upg.nitro || 0) *
              0.15
            )
        );
    }

    state.speed =
      state.baseSpeed *
      (
        1 +
        state.boost *
        nitro
      );

    state.dist +=
      state.speed * dt;

    state.roadOff +=
      state.speed * dt;

    state.score +=
      (
        state.speed * 0.12 +
        state.combo * 10
      ) * dt;

    scoreEl.textContent =
      String(
        Math.floor(state.score)
      );

    if (
      state.speed >
      state.maxSpd
    ) {
      state.maxSpd =
        state.speed;
    }

    while (
      state.score >=
      state.mile
    ) {
      state.floats.push({
        x: W / 2,
        y: H * 0.38,
        text:
          Math.floor(
            state.mile / 1000
          ) + "K!",
        life: 1.1
      });

      comboEl.textContent =
        Math.floor(
          state.mile / 1000
        ) + "K · HARDER";

      const pulse =
        (save.upg.focus || 0) *
        0.28;

      if (pulse) {
        p.inv =
          Math.max(
            p.inv,
            pulse
          );
      }

      beep(
        600,
        0.08,
        "sine",
        0.05,
        900
      );

      state.mile += 1000;
    }

    const spdEl =
      document.getElementById(
        "spd"
      );

    if (spdEl) {
      spdEl.textContent =
        String(
          Math.floor(
            state.speed * 0.32
          )
        );
    }

    if (p.skin) {
      p.color =
        skinColor(
          p.skin,
          state.t
        );
    }

    if (
      !state.newBest &&
      state.score >
        (save.best || 0) &&
      save.best > 0
    ) {
      state.newBest = true;
      state.bestT = 2.6;

      beep(
        523,
        0.1,
        "sine",
        0.05,
        784
      );

      setTimeout(() => {
        beep(
          784,
          0.16,
          "sine",
          0.06,
          1046
        );
      }, 90);
    } else if (
      !state.newBest &&
      save.best <= 0 &&
      state.score > 80
    ) {
      state.newBest = true;
      state.bestT = 2.2;
    }

    if (state.bestT > 0) {
      state.bestT -= dt;
    }

    state.laneCool -= dt;

    if (state.laneCool <= 0) {
      if (
        keys.l &&
        !keys.r &&
        p.lane > 0
      ) {
        p.lane -= 1;
        state.laneCool = 0.16;

        laneDust(p);

        beep(
          320,
          0.05,
          "sine",
          0.03
        );
      } else if (
        keys.r &&
        !keys.l &&
        p.lane <
          LANES - 1
      ) {
        p.lane += 1;
        state.laneCool = 0.16;

        laneDust(p);

        beep(
          380,
          0.05,
          "sine",
          0.03
        );
      }
    }

    const tx =
      laneX(p.lane);

    p.x +=
      (tx - p.x) *
      Math.min(
        1,
        dt * 14
      );

    state.spawnT -= dt;

    const spawnEvery =
      Math.max(
        0.16,
        (
          1.05 -
          state.t * 0.006
        ) *
        Math.pow(
          0.8,
          heat
        )
      );

    if (state.spawnT <= 0) {
      const roll = Math.random();

      const packChance =
        heat >= 1
          ? Math.min(
              0.72,
              0.18 +
                heat * 0.08
            )
          : 0;

      const gapChance =
        heat >= 6
          ? 0.08
          : (
            heat >= 1
              ? 0.16
              : 0.32
          );

      if (
        state.t < 3 ||
        roll < gapChance
      ) {
        state.wave = "gap";

        state.spawnT =
          spawnEvery *
          rand(1.1, 1.8);
      } else if (
        roll <
        gapChance +
        packChance
      ) {
        state.wave = "pack";

        const holes =
          new Set();

        holes.add(
          (Math.random() *
            LANES) | 0
        );

        if (heat < 7) {
          holes.add(
            (
              holes.values()
                .next().value +
              1 +
              (
                Math.random() * 2
              ) | 0
            ) % LANES
          );
        }

        for (
          let i = 0;
          i < LANES;
          i++
        ) {
          if (!holes.has(i)) {
            spawnCar({
              lane: i,
              y:
                -80 -
                Math.random() *
                20
            });
          }
        }

        state.spawnT =
          spawnEvery *
          rand(1.15, 1.7);
      } else {
        state.wave = "norm";

        spawnCar();

        if (
          heat >= 1 &&
          Math.random() <
            Math.min(
              0.55,
              0.15 +
                heat * 0.06
            )
        ) {
          spawnCar();
        }

        if (
          heat >= 5 &&
          Math.random() < 0.28
        ) {
          spawnCar();
        }

        state.spawnT =
          spawnEvery *
          rand(0.85, 1.3);
      }
    }

    state.coinT -= dt;

    if (state.coinT <= 0) {
      if (Math.random() < 0.12) {
        spawnCoin();
      }

      state.coinT =
        rand(5.5, 10);
    }

    for (const c of state.cars) {
      const rush =
        Math.max(
          0.62,
          0.92 -
            (save.upg.brake || 0) *
            0.05
        );

      c.y +=
        (
          state.speed -
          c.vy * 0.15
        ) *
        dt *
        rush +
        c.vy *
        dt *
        0.25;

      if (
        c.wander > 0 &&
        c.y > 40 &&
        c.y <
          p.y - 90
      ) {
        c.wander -= dt;

        if (c.wander <= 0) {
          const next =
            c.lane +
            (
              Math.random() < 0.5
                ? -1
                : 1
            );

          const taken =
            state.cars.some(
              o =>
                o !== c &&
                o.lane === next &&
                Math.abs(
                  o.y - c.y
                ) < 80
            );

          if (
            next >= 0 &&
            next < LANES &&
            !taken &&
            next !== p.lane
          ) {
            c.lane = next;
          }

          c.wander = 0;
        }
      }

      c.x +=
        (
          laneX(c.lane) -
          c.x
        ) * 0.2;

      if (
        !c.passed &&
        c.y >
          p.y +
          p.h * 0.2
      ) {
        c.passed = true;

        state.score +=
          20 +
          state.combo * 6;
      }

      if (
        !c.near &&
        Math.abs(
          c.y - p.y
        ) < 50
      ) {
        const dx =
          Math.abs(
            c.x - p.x
          );

        if (
          dx >
            (c.w + p.w) *
            0.48 &&
          dx <
            LANE_W * 0.95
        ) {
          c.near = true;

          state.combo += 1;
          save.stats.near += 1;
          state.runNear += 1;

          state.comboT = 2.8;

          state.score +=
            40 *
            state.combo;

          comboEl.textContent =
            state.combo > 1
              ? `NEAR MISS ×${state.combo}`
              : "NEAR MISS!";

          beep(
            520 +
              state.combo * 40,
            0.09,
            "triangle",
            0.05,
            880
          );

          burst(
            (c.x + p.x) / 2,
            p.y,
            "#fff",
            8,
            140
          );
        }
      }

      const tight =
        Math.max(
          0.16,
          0.27 -
            (save.upg.slim || 0) *
            0.018
        );

      if (
        p.inv <= 0 &&
        Math.abs(
          c.x - p.x
        ) <
          (c.w + p.w) *
          tight &&
        Math.abs(
          c.y - p.y
        ) <
          (c.h + p.h) *
          (tight + 0.01)
      ) {
        if (state.bumpers > 0) {
          state.bumpers -= 1;

          p.inv = 1.15;

          state.shake = 8;
          state.flash = 0.25;

          burst(
            p.x,
            p.y,
            "#fff",
            14,
            180
          );

          beep(
            200,
            0.08,
            "square",
            0.05
          );

          comboEl.textContent =
            "BUMPER! " +
            state.bumpers +
            " left";
        } else {
          gameOver();
          return;
        }
      }
    }

    state.cars =
      state.cars.filter(
        c => c.y < H + 90
      );

    for (const k of state.coins) {
      k.y +=
        state.speed * dt;

      k.spin += dt * 6;

      const mag =
        (save.upg.magnet || 0) *
        22;

      if (
        mag &&
        Math.abs(
          k.x - p.x
        ) <
          30 + mag &&
        Math.abs(
          k.y - p.y
        ) <
          40 + mag
      ) {
        k.x +=
          (
            p.x - k.x
          ) *
          Math.min(
            1,
            dt *
              (
                3 +
                save.upg.magnet
              )
          );

        k.y +=
          (
            p.y - k.y
          ) *
          Math.min(
            1,
            dt *
              (
                3 +
                save.upg.magnet
              )
          );
      }

      if (
        Math.abs(
          k.x - p.x
        ) < 28 &&
        Math.abs(
          k.y - p.y
        ) < 36 &&
        !k.grabbed
      ) {
        k.grabbed = true;

        save.stats.coins += 1;
        state.runCoins += 1;

        const pts =
          50 +
          state.combo * 12;

        const cash =
          Math.floor(
            (
              30 +
              (save.upg.coinVal || 0) *
              22
            ) *
            multiplier()
          );

        state.score += pts;
        state.cash += cash;

        state.floats.push({
          x: k.x,
          y: k.y,
          text: "+" + pts,
          life: 0.8
        });

        beep(
          880,
          0.1,
          "sine",
          0.06,
          1320
        );

        burst(
          k.x,
          k.y,
          "#ffd166",
          12,
          180
        );
      }
    }

    state.coins =
      state.coins.filter(
        k =>
          !k.grabbed &&
          k.y < H + 30
      );

    for (const fl of state.floats) {
      fl.y -= 38 * dt;
      fl.life -= dt;
    }

    state.floats =
      state.floats.filter(
        fl => fl.life > 0
      );

    for (const pt of state.parts) {
      pt.x +=
        pt.vx * dt;

      pt.y +=
        pt.vy * dt +
        state.speed *
        dt *
        0.15;

      pt.vy +=
        40 * dt;

      pt.life -= dt;
    }

    state.parts =
      state.parts.filter(
        pt => pt.life > 0
      );

    if (state.boost > 0.2) {
      burst(
        p.x + rand(-8, 8),
        p.y + p.h * 0.45,
        "#7cffb2",
        1,
        40
      );
    }
  }

  function roundRect(x, y, w, h, r) {
    ctx.beginPath();

    ctx.moveTo(
      x + r,
      y
    );

    ctx.arcTo(
      x + w,
      y,
      x + w,
      y + h,
      r
    );

    ctx.arcTo(
      x + w,
      y + h,
      x,
      y + h,
      r
    );

    ctx.arcTo(
      x,
      y + h,
      x,
      y,
      r
    );

    ctx.arcTo(
      x,
      y,
      x + w,
      y,
      r
    );

    ctx.closePath();
  }

  function drawCar(
    x,
    y,
    w,
    h,
    color,
    player
  ) {
    ctx.save();

    ctx.translate(
      x,
      y
    );

    ctx.fillStyle =
      "rgba(0,0,0,0.35)";

    ctx.beginPath();

    ctx.ellipse(
      0,
      h * 0.48,
      w * 0.55,
      7,
      0,
      0,
      Math.PI * 2
    );

    ctx.fill();

    ctx.fillStyle = color;

    roundRect(
      -w / 2,
      -h / 2,
      w,
      h,
      8
    );

    ctx.fill();

    ctx.fillStyle =
      "rgba(0,0,0,0.18)";

    roundRect(
      -w / 2,
      4,
      w,
      h / 2 - 4,
      6
    );

    ctx.fill();

    ctx.fillStyle =
      player
        ? "rgba(220,255,240,0.85)"
        : "rgba(30,40,70,0.55)";

    roundRect(
      -w * 0.32,
      -h * 0.28,
      w * 0.64,
      h * 0.32,
      5
    );

    ctx.fill();

    ctx.fillStyle =
      player
        ? "#fff6b0"
        : "#ff6b6b";

    ctx.fillRect(
      -w * 0.36,
      h * 0.32,
      w * 0.18,
      5
    );

    ctx.fillRect(
      w * 0.18,
      h * 0.32,
      w * 0.18,
      5
    );

    ctx.fillStyle =
      player &&
      state.player
        ? state.player.color ||
          "#7cffb2"
        : "#ffe08a";

    ctx.fillRect(
      -w * 0.36,
      -h * 0.46,
      w * 0.18,
      5
    );

    ctx.fillRect(
      w * 0.18,
      -h * 0.46,
      w * 0.18,
      5
    );

    ctx.fillStyle =
      player &&
      state.player &&
      state.player.skin
        ? state.player.skin.stripe
        : "rgba(255,255,255,0.28)";

    ctx.fillRect(
      -3,
      -h * 0.42,
      6,
      h * 0.28
    );

    if (
      player &&
      state.boost > 0.15
    ) {
      ctx.fillStyle =
        `rgba(124,255,178,${0.35 + state.boost * 0.4})`;

      ctx.beginPath();

      ctx.moveTo(
        -8,
        h * 0.5
      );

      ctx.lineTo(
        0,
        h * 0.5 +
          16 +
          state.boost * 18
      );

      ctx.lineTo(
        8,
        h * 0.5
      );

      ctx.fill();
    }

    ctx.restore();
  }

  function drawTree(tr) {
    const x =
      tr.side === 0
        ? randish(tr, 22)
        : W - randish(tr, 22);

    const y = tr.y;

    ctx.save();

    ctx.translate(
      x,
      y
    );

    ctx.scale(
      tr.s,
      tr.s
    );

    const kind =
      tr.kind || "tree";

    if (kind === "bush") {
      ctx.fillStyle =
        `hsl(${tr.hue}, 50%, 32%)`;

      ctx.beginPath();

      ctx.ellipse(
        0,
        10,
        16,
        10,
        0,
        0,
        Math.PI * 2
      );

      ctx.fill();

      ctx.fillStyle =
        `hsl(${tr.hue}, 55%, 42%)`;

      ctx.beginPath();

      ctx.ellipse(
        -6,
        6,
        9,
        7,
        0,
        0,
        Math.PI * 2
      );

      ctx.fill();

    } else if (kind === "rock") {
      ctx.fillStyle =
        "#6b7280";

      ctx.beginPath();

      ctx.ellipse(
        0,
        12,
        12,
        7,
        0,
        0,
        Math.PI * 2
      );

      ctx.fill();

      ctx.fillStyle =
        "#9aa3b2";

      ctx.beginPath();

      ctx.ellipse(
        -3,
        10,
        6,
        4,
        0,
        0,
        Math.PI * 2
      );

      ctx.fill();

    } else if (kind === "sign") {
      ctx.fillStyle =
        "#5a3a22";

      ctx.fillRect(
        -2,
        0,
        4,
        22
      );

      ctx.fillStyle =
        "#2f9e44";

      ctx.fillRect(
        -12,
        -8,
        24,
        16
      );

      ctx.fillStyle =
        "#fff";

      ctx.fillRect(
        -8,
        -2,
        16,
        3
      );

    } else if (kind === "lamp") {
      ctx.fillStyle =
        "#3d4454";

      ctx.fillRect(
        -2,
        -8,
        4,
        28
      );

      ctx.fillStyle =
        "#f4e27a";

      ctx.beginPath();

      ctx.arc(
        0,
        -12,
        6,
        0,
        Math.PI * 2
      );

      ctx.fill();

      ctx.fillStyle =
        "rgba(244,226,122,0.2)";

      ctx.beginPath();

      ctx.arc(
        0,
        -12,
        14,
        0,
        Math.PI * 2
      );

      ctx.fill();

    } else if (kind === "flower") {
      ctx.fillStyle =
        "#2f9e44";

      ctx.fillRect(
        -1,
        8,
        2,
        10
      );

      ctx.fillStyle =
        "#ffd166";

      ctx.beginPath();

      ctx.arc(
        0,
        6,
        4,
        0,
        Math.PI * 2
      );

      ctx.fill();

      ctx.fillStyle =
        "#ff6b6b";

      for (let i = 0; i < 5; i++) {
        const a = i * 1.26;

        ctx.beginPath();

        ctx.arc(
          Math.cos(a) * 5,
          6 + Math.sin(a) * 5,
          2.2,
          0,
          Math.PI * 2
        );

        ctx.fill();
      }

    } else {
      ctx.fillStyle =
        "#5a3a22";

      ctx.fillRect(
        -3,
        8,
        6,
        16
      );

      ctx.fillStyle =
        `hsl(${tr.hue}, 55%, 38%)`;

      ctx.beginPath();

      ctx.arc(
        0,
        0,
        14,
        0,
        Math.PI * 2
      );

      ctx.fill();

      ctx.fillStyle =
        `hsl(${tr.hue}, 60%, 48%)`;

      ctx.beginPath();

      ctx.arc(
        -6,
        -4,
        9,
        0,
        Math.PI * 2
      );

      ctx.fill();
    }

    ctx.restore();
  }

  function randish(tr, base) {
    return base +
      (
        (
          Math.sin(
            tr.y * 0.01 +
            tr.s * 9
          ) + 1
        ) * 8
      );
  }

  function draw() {
    const shx =
      state.shake
        ? (
          Math.random() - 0.5
        ) * state.shake
        : 0;

    const shy =
      state.shake
        ? (
          Math.random() - 0.5
        ) * state.shake
        : 0;

    ctx.setTransform(
      1,
      0,
      0,
      1,
      shx,
      shy
    );

    const g =
      ctx.createLinearGradient(
        0,
        0,
        0,
        H
      );

    g.addColorStop(
      0,
      "#1b2a5a"
    );

    g.addColorStop(
      0.45,
      "#243056"
    );

    g.addColorStop(
      1,
      "#14182a"
    );

    ctx.fillStyle = g;

    ctx.fillRect(
      -20,
      -20,
      W + 40,
      H + 40
    );

    ctx.fillStyle =
      "#1a2744";

    ctx.beginPath();

    ctx.moveTo(
      -20,
      210
    );

    for (
      let x = 0;
      x <= W;
      x += 20
    ) {
      ctx.lineTo(
        x,
        170 +
          Math.sin(
            x * 0.03 +
            state.t * 0.2
          ) * 10
      );
    }

    ctx.lineTo(
      W + 20,
      240
    );

    ctx.lineTo(
      -20,
      240
    );

    ctx.fill();

    ctx.fillStyle =
      "#1d6b3a";

    ctx.fillRect(
      0,
      0,
      ROAD_L - 8,
      H
    );

    ctx.fillStyle =
      "#185c32";

    ctx.fillRect(
      ROAD_R + 8,
      0,
      W - ROAD_R,
      H
    );

    ctx.fillStyle =
      "#0f3d20";

    ctx.fillRect(
      ROAD_L - 14,
      0,
      8,
      H
    );

    ctx.fillRect(
      ROAD_R + 6,
      0,
      8,
      H
    );

    for (const tr of state.trees) {
      drawTree(tr);
    }

    ctx.fillStyle =
      "#2b3144";

    ctx.fillRect(
      ROAD_L - 6,
      -20,
      ROAD_W + 12,
      H + 40
    );

    const curbH = 18;

    for (
      let y =
        -(
          (
            state.roadOff *
            0.4
          ) %
          (curbH * 2)
        );
      y < H + 20;
      y += curbH * 2
    ) {
      ctx.fillStyle =
        "#f2f2f2";

      ctx.fillRect(
        ROAD_L - 6,
        y,
        6,
        curbH
      );

      ctx.fillRect(
        ROAD_R,
        y,
        6,
        curbH
      );

      ctx.fillStyle =
        "#e63946";

      ctx.fillRect(
        ROAD_L - 6,
        y + curbH,
        6,
        curbH
      );

      ctx.fillRect(
        ROAD_R,
        y + curbH,
        6,
        curbH
      );
    }

    ctx.fillStyle =
      "#f4e27a";

    const dash = 28;
    const gap = 22;
    const period =
      dash + gap;

    const off =
      state.roadOff %
      period;

    for (
      let i = 1;
      i < LANES;
      i++
    ) {
      const x =
        ROAD_L +
        LANE_W * i;

      for (
        let y = -off;
        y < H + period;
        y += period
      ) {
        ctx.fillRect(
          x - 2,
          y,
          4,
          dash
        );
      }
    }

    for (const k of state.coins) {
      ctx.save();

      ctx.translate(
        k.x,
        k.y
      );

      ctx.scale(
        Math.cos(k.spin) * 0.35 + 0.65,
        1
      );

      ctx.fillStyle =
        "#ffd166";

      ctx.beginPath();

      ctx.arc(
        0,
        0,
        k.r,
        0,
        Math.PI * 2
      );

      ctx.fill();

      ctx.fillStyle =
        "#ffe9a6";

      ctx.beginPath();

      ctx.arc(
        -3,
        -3,
        k.r * 0.45,
        0,
        Math.PI * 2
      );

      ctx.fill();

      ctx.strokeStyle =
        "#c79212";

      ctx.lineWidth = 2;

      ctx.beginPath();

      ctx.arc(
        0,
        0,
        k.r - 2,
        0,
        Math.PI * 2
      );

      ctx.stroke();

      ctx.restore();
    }

    const sorted =
      state.cars
        .slice()
        .sort(
          (a, b) =>
            a.y - b.y
        );

    for (const c of sorted) {
      drawCar(
        c.x,
        c.y,
        c.w,
        c.h,
        c.color,
        false
      );
    }

    if (
      state.mode === "play" ||
      state.mode === "over"
    ) {
      const p = state.player;

      if (
        state.mode === "play"
      ) {
        drawCar(
          p.x,
          p.y,
          p.w,
          p.h,
          p.color,
          true
        );
      }
    }

    ctx.font =
      "bold 16px Trebuchet MS";

    ctx.textAlign = "center";

    for (const fl of state.floats) {
      ctx.globalAlpha =
        Math.max(
          0,
          fl.life / 0.8
        );

      ctx.fillStyle =
        "#ffd166";

      ctx.strokeStyle =
        "rgba(0,0,0,0.45)";

      ctx.lineWidth = 3;

      ctx.strokeText(
        fl.text,
        fl.x,
        fl.y
      );

      ctx.fillText(
        fl.text,
        fl.x,
        fl.y
      );
    }

    ctx.globalAlpha = 1;
    ctx.textAlign = "left";

    if (
      state.mode === "play" &&
      state.bestT > 0
    ) {
      ctx.save();

      ctx.globalAlpha =
        Math.min(
          1,
          state.bestT
        );

      ctx.textAlign =
        "center";

      ctx.font =
        "bold 28px Trebuchet MS";

      ctx.fillStyle =
        "#ffd166";

      ctx.strokeStyle =
        "rgba(0,0,0,0.5)";

      ctx.lineWidth = 5;

      ctx.strokeText(
        "HIGH SCORE!",
        W / 2,
        86
      );

      ctx.fillText(
        "HIGH SCORE!",
        W / 2,
        86
      );

      ctx.restore();
    }

    if (
      state.mode === "play" &&
      state.paused
    ) {
      ctx.fillStyle =
        "rgba(6,8,18,0.45)";

      ctx.fillRect(
        0,
        0,
        W,
        H
      );

      ctx.textAlign =
        "center";

      ctx.font =
        "bold 34px Trebuchet MS";

      ctx.fillStyle =
        "#fff";

      ctx.fillText(
        "PAUSED",
        W / 2,
        H / 2
      );

      ctx.font =
        "14px Trebuchet MS";

      ctx.fillStyle =
        "rgba(255,255,255,0.75)";

      ctx.fillText(
        "Press P or Enter",
        W / 2,
        H / 2 + 28
      );

      ctx.textAlign =
        "left";
    }

    for (const pt of state.parts) {
      ctx.globalAlpha =
        Math.max(
          0,
          pt.life / pt.max
        );

      ctx.fillStyle =
        pt.color;

      ctx.fillRect(
        pt.x,
        pt.y,
        pt.size,
        pt.size
      );
    }

    ctx.globalAlpha = 1;

    if (
      state.mode === "play" &&
      state.boost > 0.2
    ) {
      ctx.strokeStyle =
        `rgba(255,255,255,${state.boost * 0.25})`;

      ctx.lineWidth = 2;

      for (let i = 0; i < 10; i++) {
        const x =
          ROAD_L +
          Math.random() *
          ROAD_W;

        const y =
          Math.random() *
          H;

        ctx.beginPath();

        ctx.moveTo(
          x,
          y
        );

        ctx.lineTo(
          x,
          y +
            18 +
            state.boost * 24
        );

        ctx.stroke();
      }
    }

    if (state.mode === "play") {
      ctx.fillStyle =
        "rgba(0,0,0,0.35)";

      roundRect(
        16,
        H - 28,
        120,
        10,
        5
      );

      ctx.fill();

      ctx.fillStyle =
        state.boost > 0.7
          ? "#ffd166"
          : "#7cffb2";

      roundRect(
        16,
        H - 28,
        120 *
          state.boost,
        10,
        5
      );

      ctx.fill();

      ctx.fillStyle =
        "rgba(255,255,255,0.7)";

      ctx.font =
        "10px Trebuchet MS";

      ctx.fillText(
        "BOOST   " +
        Math.floor(
          state.speed * 0.32
        ) +
        " SPEED",
        16,
        H - 32
      );
    }

    if (state.flash > 0) {
      ctx.fillStyle =
        `rgba(255,255,255,${state.flash * 0.55})`;

      ctx.fillRect(
        -20,
        -20,
        W + 40,
        H + 40
      );
    }

    ctx.setTransform(
      1,
      0,
      0,
      1,
      0,
      0
    );
  }

  let last =
    performance.now();

  function loop(now) {
    const dt =
      Math.min(
        0.033,
        (now - last) / 1000
      );

    last = now;

    update(dt);
    draw();

    requestAnimationFrame(
      loop
    );
  }

  resetGame();

  requestAnimationFrame(
    loop
  );
})();
</script>
</body>
</html>
