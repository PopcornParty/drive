<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Turbo Lanes</title>
  <style>
    :root {
      --bg: #0b1020;
      --road: #2a2f3d;
      --line: #f4e27a;
      --accent: #7cffb2;
      --danger: #ff5d7a;
      --gold: #ffd166;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
    html, body {
      width: 100%; height: 100%;
      background: radial-gradient(ellipse at top, #1a2450 0%, var(--bg) 55%);
      overflow: hidden;
      font-family: "Trebuchet MS", "Segoe UI", system-ui, sans-serif;
      color: #fff;
      touch-action: none;
    }
    #wrap {
      position: relative;
      width: 100%; height: 100%;
      display: flex; align-items: center; justify-content: center;
    }
    canvas {
      display: block;
      max-width: 100%; max-height: 100%;
      background: #111;
      box-shadow: 0 0 80px rgba(124, 255, 178, 0.12);
      border-radius: 8px;
    }
    #hud {
      position: absolute; inset: 0;
      pointer-events: none;
      display: flex; flex-direction: column;
    }
    #topbar {
      display: flex; justify-content: space-between; align-items: flex-start;
      padding: 14px 18px;
      text-shadow: 0 2px 8px #000;
      gap: 8px;
    }
    .stat { font-size: 13px; letter-spacing: 0.5px; opacity: 0.95; }
    .stat b { color: var(--gold); font-size: 18px; }
    #combo {
      text-align: center; font-size: 22px; font-weight: 800;
      color: var(--accent);
      text-shadow: 0 0 16px rgba(124,255,178,0.6);
      min-height: 28px;
    }
    #overlay {
      position: absolute; inset: 0;
      display: flex; align-items: center; justify-content: center;
      background: rgba(6, 8, 18, 0.72);
      backdrop-filter: blur(6px);
      pointer-events: auto;
    }
    #overlay.hidden { display: none; }
    .panel {
      text-align: center;
      padding: 28px 32px;
      max-width: 420px;
    }
    h1 {
      font-size: 42px;
      letter-spacing: 2px;
      background: linear-gradient(180deg, #fff 20%, var(--accent));
      -webkit-background-clip: text; background-clip: text; color: transparent;
      filter: drop-shadow(0 4px 0 #0a3);
      margin-bottom: 8px;
    }
    .sub { opacity: 0.8; margin-bottom: 22px; line-height: 1.45; }
    button {
      pointer-events: auto;
      border: 0; cursor: pointer;
      background: linear-gradient(180deg, #9dffc8, #2ee08a);
      color: #062814;
      font-weight: 800; font-size: 18px;
      padding: 12px 28px;
      border-radius: 999px;
      box-shadow: 0 6px 0 #178a52, 0 12px 24px rgba(0,0,0,0.35);
      transition: transform 0.08s ease;
    }
    button:active { transform: translateY(4px); box-shadow: 0 2px 0 #178a52; }
    .keys { margin-top: 18px; font-size: 13px; opacity: 0.75; }
    kbd {
      display: inline-block;
      background: #1c2438; border: 1px solid #3a4564;
      padding: 2px 7px; border-radius: 5px; margin: 0 2px;
    }
    #go-title { font-size: 34px; color: var(--danger); margin-bottom: 6px; }
    #go-score { font-size: 18px; margin: 10px 0 18px; }
    #controls {
      position: absolute; left: 0; right: 0; bottom: 12px;
      display: none;
      justify-content: center;
      gap: 12px;
      pointer-events: none;
      z-index: 5;
    }
    #controls.show { display: flex; }
    #controls button {
      pointer-events: auto;
      width: 74px; height: 74px;
      border-radius: 18px;
      font-size: 28px;
      padding: 0;
      background: rgba(255,255,255,0.16);
      color: #fff;
      box-shadow: 0 4px 0 rgba(0,0,0,0.35);
      border: 2px solid rgba(255,255,255,0.25);
    }
    #controls button:active { transform: translateY(3px); }
    #boost-btn { width: 88px !important; background: rgba(124,255,178,0.28) !important; }
    #overlay { z-index: 8; cursor: default; }
    button { position: relative; z-index: 9; }
    .row-btns { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-top: 8px; }
    .ghost {
      background: linear-gradient(180deg, #d7e0ff, #8ea2e8) !important;
      color: #12183a !important;
      box-shadow: 0 6px 0 #4d5ea8, 0 12px 24px rgba(0,0,0,0.35) !important;
    }
    .ghost:active { box-shadow: 0 2px 0 #4d5ea8 !important; }
    #shop-panel { display: none; width: min(420px, 94vw); max-height: 86vh; overflow: auto; }
    #shop-panel h2 { margin-bottom: 4px; letter-spacing: 1px; }
    #shop-bank { color: var(--gold); font-weight: 800; margin-bottom: 12px; }
    #shop-msg { min-height: 18px; font-size: 13px; color: var(--accent); margin-bottom: 8px; }
    .shop-sec { text-align: left; margin: 10px 0 6px; font-size: 13px; opacity: 0.75; letter-spacing: 1px; }
    .shop-item {
      display: flex; align-items: center; gap: 10px;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 12px;
      padding: 8px 10px;
      margin-bottom: 8px;
      cursor: pointer;
    }
    .shop-item:hover { background: rgba(255,255,255,0.12); }
    .shop-item.owned { border-color: rgba(124,255,178,0.35); }
    .shop-item.selected { outline: 2px solid var(--accent); }
    .swatch {
      width: 28px; height: 36px; border-radius: 7px; flex: 0 0 auto;
      box-shadow: inset 0 -8px 0 rgba(0,0,0,0.2), 0 2px 0 rgba(0,0,0,0.3);
    }
    .shop-item .info { flex: 1; text-align: left; }
    .shop-item .info b { display: block; font-size: 14px; }
    .shop-item .info span { font-size: 12px; opacity: 0.75; }
    .price {
      font-weight: 800; color: var(--gold); font-size: 13px; white-space: nowrap;
    }
    .board {
      margin: 14px auto 0;
      width: 100%;
      max-width: 280px;
      text-align: left;
    }
    .board h3 {
      font-size: 12px;
      letter-spacing: 2px;
      opacity: 0.7;
      text-align: center;
      margin-bottom: 6px;
    }
    .board-row {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 5px 8px;
      border-radius: 8px;
      background: rgba(255,255,255,0.05);
      margin-bottom: 4px;
      font-size: 14px;
    }
    .board-row .pos { width: 22px; font-weight: 800; color: var(--gold); }
    .board-row .who { flex: 1; letter-spacing: 3px; font-weight: 800; }
    .board-row .pts { color: var(--gold); font-weight: 800; }
    #name-panel { display: none; }
    .letters {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin: 16px 0 12px;
    }
    .letter-col { display: flex; flex-direction: column; align-items: center; gap: 4px; }
    .letter-col button {
      width: 46px; height: 28px; padding: 0; font-size: 14px;
      box-shadow: 0 3px 0 #178a52;
      border-radius: 8px;
    }
    .letter-box {
      width: 54px; height: 64px;
      border-radius: 12px;
      background: #1c2438;
      border: 2px solid #3a4564;
      font-size: 36px;
      font-weight: 800;
      letter-spacing: 0;
      display: flex; align-items: center; justify-content: center;
    }
    .letter-box.on { border-color: var(--accent); box-shadow: 0 0 12px rgba(124,255,178,0.35); }
    #daily-btn.ready { background: linear-gradient(180deg, #ffe08a, #ffd166) !important; color: #3a2a00 !important; box-shadow: 0 6px 0 #c79212, 0 12px 24px rgba(0,0,0,0.35) !important; }
    #garage-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 8px; }
    .gar-card {
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 12px;
      padding: 10px 8px;
      cursor: pointer;
      text-align: center;
    }
    .gar-card.selected { outline: 2px solid var(--accent); }
    .gar-card .swatch { margin: 0 auto 6px; width: 36px; height: 46px; }
    .gar-card b { display: block; font-size: 13px; }
    .gar-card span { font-size: 11px; opacity: 0.75; }
    #music-btn {
      position: absolute; top: 10px; right: 10px; z-index: 12;
      width: 44px; height: 44px; padding: 0;
      border-radius: 12px;
      font-size: 20px;
      background: rgba(255,255,255,0.14) !important;
      color: #fff !important;
      box-shadow: 0 3px 0 rgba(0,0,0,0.35) !important;
      border: 2px solid rgba(255,255,255,0.2);
    }
  </style>
</head>
<body>
  <div id="wrap">
    <canvas id="c" width="420" height="720"></canvas>
    <div id="hud">
      <div id="topbar">
        <div class="stat">SCORE<br><b id="score">0</b></div>
        <div class="stat" style="text-align:center">BANK<br><b id="bank">0</b></div>
        <div class="stat" style="text-align:right">BEST<br><b id="best">0</b></div>
      </div>
      <div id="combo"></div>
    </div>
    <div id="overlay">
      <div class="panel" id="start-panel">
        <h1>TURBO LANES</h1>
        <p class="sub">Dodge traffic. Grab gold coins for extra score.<br>Bank that score and spend it in the shop.</p>
        <div class="row-btns">
          <button type="button" id="play-btn">START ENGINE</button>
          <button type="button" id="shop-btn" class="ghost">SHOP</button>
          <button type="button" id="stats-btn" class="ghost">STATS</button>
          <button type="button" id="garage-btn" class="ghost">GARAGE</button>
        </div>
        <div class="row-btns">
          <button type="button" id="daily-btn" class="ghost">DAILY BONUS</button>
        </div>
        <p class="keys" id="menu-stats"></p>
        <div class="board" id="board-menu"></div>
      </div>
      <div class="panel" id="go-panel" style="display:none">
        <div id="go-title">CRASH!</div>
        <div id="go-score"></div>
        <div class="board" id="board-go"></div>
        <div class="row-btns">
          <button type="button" id="retry-btn">RACE AGAIN</button>
          <button type="button" id="shop-btn-go" class="ghost">SHOP</button>
          <button type="button" id="stats-btn-go" class="ghost">STATS</button>
        </div>
      </div>
      <div class="panel" id="name-panel">
        <h2>NEW HIGH SCORE</h2>
        <p class="sub" id="name-score-line">Enter a 3-letter name</p>
        <div class="letters">
          <div class="letter-col">
            <button type="button" data-slot="0" data-dir="1">▲</button>
            <div class="letter-box on" id="let0">A</div>
            <button type="button" data-slot="0" data-dir="-1">▼</button>
          </div>
          <div class="letter-col">
            <button type="button" data-slot="1" data-dir="1">▲</button>
            <div class="letter-box" id="let1">A</div>
            <button type="button" data-slot="1" data-dir="-1">▼</button>
          </div>
          <div class="letter-col">
            <button type="button" data-slot="2" data-dir="1">▲</button>
            <div class="letter-box" id="let2">A</div>
            <button type="button" data-slot="2" data-dir="-1">▼</button>
          </div>
        </div>
        <button type="button" id="name-save">SAVE NAME</button>
      </div>
      <div class="panel" id="shop-panel">
        <h2>PIT STOP SHOP</h2>
        <div id="shop-bank">Bank: 0</div>
        <div id="shop-msg"></div>
        <div class="shop-sec">POINT MULTIPLIER</div>
        <div id="shop-mult"></div>
        <div class="shop-sec">CAR SKINS</div>
        <div id="shop-skins"></div>
        <div class="row-btns" style="margin-top:14px">
          <button type="button" id="shop-back" class="ghost">BACK</button>
        </div>
      </div>
      <div class="panel" id="stats-panel" style="display:none;width:min(420px,94vw);max-height:86vh;overflow:auto">
        <h2>DRIVER STATS</h2>
        <div id="stats-list" class="board"></div>
        <div class="shop-sec">ADMIN CODE</div>
        <div style="display:flex;gap:8px;margin:8px 0 4px">
          <input id="code-in" maxlength="16" placeholder="Enter code" autocomplete="off" spellcheck="false"
            style="flex:1;border:0;border-radius:10px;padding:10px 12px;background:#1c2438;color:#fff;font-weight:800;letter-spacing:1px" />
          <button type="button" id="code-go" class="ghost" style="padding:10px 16px">OK</button>
        </div>
        <div id="code-msg" style="min-height:18px;font-size:13px;color:var(--accent)"></div>
        <div class="row-btns" style="margin-top:14px">
          <button type="button" id="stats-back" class="ghost">BACK</button>
        </div>
      </div>
      <div class="panel" id="garage-panel" style="display:none;width:min(420px,94vw);max-height:86vh;overflow:auto">
        <h2>GARAGE</h2>
        <p class="sub" id="garage-sub">Tap a car you own to drive it.</p>
        <div id="garage-grid"></div>
        <div class="row-btns" style="margin-top:14px">
          <button type="button" id="garage-back" class="ghost">BACK</button>
        </div>
      </div>
    </div>
    <div id="controls">
      <button type="button" id="left-btn">◀</button>
      <button type="button" id="boost-btn">▲</button>
      <button type="button" id="right-btn">▶</button>
    </div>
    <button type="button" id="music-btn" title="Music on/off">♪</button>
  </div>

<script>
(() => {
  const canvas = document.getElementById("c");
  const ctx = canvas.getContext("2d");
  const W = canvas.width, H = canvas.height;

  const overlay = document.getElementById("overlay");
  const startPanel = document.getElementById("start-panel");
  const goPanel = document.getElementById("go-panel");
  const scoreEl = document.getElementById("score");
  const bestEl = document.getElementById("best");
  const comboEl = document.getElementById("combo");
  const goScore = document.getElementById("go-score");

  const LANES = 4;
  const ROAD_L = 56, ROAD_R = W - 56;
  const ROAD_W = ROAD_R - ROAD_L;
  const LANE_W = ROAD_W / LANES;
  const laneX = (i) => ROAD_L + LANE_W * (i + 0.5);

  const CAR_COLORS = ["#ff5d7a", "#ffd166", "#4cc9f0", "#c77dff", "#ff9f1c", "#00bbf9", "#f72585"];
  const SKINS = [
    { id: "starter", name: "Mint", color: "#7cffb2", stripe: "#ffffff", price: 0 },
    { id: "ruby", name: "Ruby", color: "#ff4d6d", stripe: "#ffffff", price: 500 },
    { id: "sunny", name: "Sunny", color: "#ffd166", stripe: "#ffffff", price: 2000 },
    { id: "sky", name: "Sky", color: "#4cc9f0", stripe: "#ffffff", price: 8000 },
    { id: "grape", name: "Grape", color: "#c77dff", stripe: "#ffffff", price: 25000 },
    { id: "tiger", name: "Tiger", color: "#ff9f1c", stripe: "#3d2b1f", price: 80000 },
    { id: "shadow", name: "Shadow", color: "#2b2d42", stripe: "#ffd166", price: 250000 },
    { id: "rainbow", name: "Rainbow", color: "rainbow", stripe: "#ffffff", price: 1000000 },
  ];
  const MAX_MULT_LV = 40;
  const SAVE_KEY = "turboLanesSave";
  function multCost(level) {
    // cost to buy the next +0.1 from this level
    return Math.floor(750 * Math.pow(2.1, level));
  }
  function formatPts(n) {
    return Math.floor(n).toLocaleString("en-US");
  }

  function loadSave() {
    try {
      const raw = localStorage.getItem(SAVE_KEY);
      if (raw) {
        const s = JSON.parse(raw);
        return {
          bank: Math.max(0, Number(s.bank) || 0),
          best: Math.max(0, Number(s.best) || Number(localStorage.getItem("turboLanesBest") || 0)),
          multLv: clamp(Number(s.multLv) || 0, 0, MAX_MULT_LV),
          owned: Array.isArray(s.owned) && s.owned.length ? s.owned : ["starter"],
          skin: s.skin || "starter",
          board: cleanBoard(s.board),
          stats: mergeStats(s.stats),
          codes: Array.isArray(s.codes) ? s.codes : [],
          dailyLast: s.dailyLast || "",
          dailyStreak: Math.max(0, Number(s.dailyStreak) || 0),
        };
      }
    } catch (e) {}
    return {
      bank: 0,
      best: Number(localStorage.getItem("turboLanesBest") || 0),
      multLv: 0,
      owned: ["starter"],
      skin: "starter",
      board: [],
      stats: mergeStats(null),
      codes: [],
      dailyLast: "",
      dailyStreak: 0,
    };
  }
  function persist() {
    localStorage.setItem(SAVE_KEY, JSON.stringify(save));
    localStorage.setItem("turboLanesBest", String(save.best));
  }
  function todayISO() {
    const d = new Date();
    return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
  }
  function yesterdayISO() {
    const d = new Date();
    d.setDate(d.getDate() - 1);
    return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
  }
  function dailyReady() { return save.dailyLast !== todayISO(); }
  function dailyAmount() {
    const streak = Math.min(7, Math.max(1, (save.dailyStreak || 0) + (dailyReady() ? 1 : 0)));
    return 250 * streak;
  }
  function refreshDailyBtn() {
    const btn = document.getElementById("daily-btn");
    if (!btn) return;
    if (dailyReady()) {
      btn.disabled = false;
      btn.classList.add("ready");
      btn.textContent = "DAILY +" + formatPts(dailyAmount());
    } else {
      btn.disabled = true;
      btn.classList.remove("ready");
      btn.textContent = "STREAK " + (save.dailyStreak || 0) + " · TOMORROW";
    }
  }
  function claimDaily() {
    if (!dailyReady()) return;
    const y = yesterdayISO();
    save.dailyStreak = save.dailyLast === y ? (save.dailyStreak || 0) + 1 : 1;
    if (save.dailyStreak > 7) save.dailyStreak = 7;
    const amt = 250 * save.dailyStreak;
    save.dailyLast = todayISO();
    save.bank += amt;
    persist();
    refreshBankHud();
    refreshDailyBtn();
    beep(700, 0.14, "sine", 0.06, 1100);
    const menu = document.getElementById("menu-stats");
    if (menu) menu.innerHTML = `Daily streak <b style="color:var(--gold)">${save.dailyStreak}</b> · +${formatPts(amt)} banked!`;
  }
  function mergeStats(s) {
    s = s || {};
    return {
      races: Math.max(0, Number(s.races) || 0),
      coins: Math.max(0, Number(s.coins) || 0),
      near: Math.max(0, Number(s.near) || 0),
      time: Math.max(0, Number(s.time) || 0),
      dist: Math.max(0, Number(s.dist) || 0),
      earned: Math.max(0, Number(s.earned) || 0),
      spent: Math.max(0, Number(s.spent) || 0),
    };
  }
  function formatTime(sec) {
    sec = Math.floor(sec);
    const h = Math.floor(sec / 3600);
    const m = Math.floor((sec % 3600) / 60);
    const s = sec % 60;
    if (h) return h + "h " + m + "m " + s + "s";
    if (m) return m + "m " + s + "s";
    return s + "s";
  }
  const BLOCK_NAMES = new Set(["ASS","FUK","FUC","FCK","SEX","DIC","DIK","COC","COK","CUM","TIT","PUS","FAG","NIG","WTF","STD","POO","PIS","KYS","KKK","GAY"]);
  function cleanBoard(raw) {
    if (!Array.isArray(raw)) return [];
    return raw
      .map((e) => ({
        n: String(e && (e.n || e.name) || "AAA").toUpperCase().replace(/[^A-Z0-9]/g, "A").slice(0, 3).padEnd(3, "A"),
        s: Math.max(0, Number(e && (e.s != null ? e.s : e.score)) || 0),
      }))
      .sort((a, b) => b.s - a.s)
      .slice(0, 3);
  }
  function boardPlace(score) {
    const b = save.board || [];
    if (b.length < 3) return b.length;
    if (score > b[2].s) {
      if (score > b[0].s) return 0;
      if (score > b[1].s) return 1;
      return 2;
    }
    return -1;
  }
  function addToBoard(name, score) {
    let n = String(name || "ACE").toUpperCase().replace(/[^A-Z0-9]/g, "").slice(0, 3).padEnd(3, "A");
    if (BLOCK_NAMES.has(n)) n = "ACE";
    save.board = cleanBoard([...(save.board || []), { n, s: score }]);
    persist();
  }
  function renderBoard(id) {
    const el = document.getElementById(id);
    if (!el) return;
    const medals = ["1st", "2nd", "3rd"];
    const rows = [0, 1, 2].map((i) => {
      const e = (save.board || [])[i];
      return `<div class="board-row"><span class="pos">${medals[i]}</span><span class="who">${e ? e.n : "---"}</span><span class="pts">${e ? formatPts(e.s) : "—"}</span></div>`;
    }).join("");
    el.innerHTML = `<h3>LOCAL TOP 3</h3>${rows}`;
  }
  function multiplier() { return 1 + save.multLv * 0.1; }
  function currentSkin() {
    return SKINS.find(s => s.id === save.skin) || SKINS[0];
  }
  function skinColor(skin, t) {
    if (skin.color === "rainbow") {
      const h = ((t || 0) * 80) % 360;
      return `hsl(${h}, 85%, 60%)`;
    }
    return skin.color;
  }

  let save = loadSave();
  if (!save.owned.includes("starter")) save.owned.push("starter");
  if (!save.owned.includes(save.skin)) save.skin = "starter";
  if (!Array.isArray(save.board)) save.board = [];
  if (!save.stats) save.stats = mergeStats(null);
  if (!Array.isArray(save.codes)) save.codes = [];
  if (!save.dailyLast) save.dailyLast = "";
  if (!save.dailyStreak) save.dailyStreak = 0;
  renderBoard("board-menu");
  refreshDailyBtn();
  let best = save.best;
  bestEl.textContent = Math.floor(best);
  const bankEl = document.getElementById("bank");
  function refreshBankHud() {
    bankEl.textContent = formatPts(save.bank);
    const menu = document.getElementById("menu-stats");
    if (menu) menu.innerHTML = `Bank <b style="color:var(--gold)">${formatPts(save.bank)}</b> · Multiplier <b style="color:var(--accent)">x${multiplier().toFixed(1)}</b><br>Click the button or press <kbd>Enter</kbd>`;
  }

  // --- tiny audio ---
  let actx = null;
  function audio() {
    if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
    if (actx.state === "suspended") actx.resume();
    return actx;
  }
  function beep(freq, dur, type, vol, slide) {
    try {
      const a = audio();
      const o = a.createOscillator();
      const g = a.createGain();
      o.type = type || "square";
      o.frequency.setValueAtTime(freq, a.currentTime);
      if (slide) o.frequency.exponentialRampToValueAtTime(slide, a.currentTime + dur);
      g.gain.setValueAtTime(vol || 0.06, a.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001, a.currentTime + dur);
      o.connect(g); g.connect(a.destination);
      o.start(); o.stop(a.currentTime + dur);
    } catch (e) {}
  }
  function noiseCrash() {
    try {
      const a = audio();
      const n = a.createBuffer(1, a.sampleRate * 0.25, a.sampleRate);
      const d = n.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / d.length);
      const s = a.createBufferSource(); s.buffer = n;
      const f = a.createBiquadFilter(); f.type = "lowpass"; f.frequency.value = 900;
      const g = a.createGain();
      g.gain.setValueAtTime(0.22, a.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001, a.currentTime + 0.25);
      s.connect(f); f.connect(g); g.connect(a.destination);
      s.start();
    } catch (e) {}
  }

  let musicOn = localStorage.getItem("turboLanesMusic") !== "off";
  const music = { playing: false, step: 0, next: 0, song: 0 };
  const SONGS = [
    {
      beat: 0.38,
      root: 174.61,
      melody: [4,-1,5,-1,7,-1,9,7,5,-1,4,-1,2,-1,0,-1,4,-1,7,-1,9,-1,7,5,4,-1,2,-1,0,-1,-1,-1,9,-1,7,-1,5,-1,4,2,0,-1,2,-1,4,-1,5,-1,7,-1,5,-1,4,2,0,-1,2,-1,0,-1,-1,-1,-1,-1],
      bass: [0,-1,-1,-1,0,-1,4,-1,5,-1,-1,-1,5,-1,4,-1,0,-1,-1,-1,4,-1,5,-1,7,-1,5,-1,4,-1,0,-1],
    },
    {
      beat: 0.26,

      melody: [0,2,4,-1,7,4,2,0,4,-1,5,4,2,-1,0,-1,7,5,4,2,0,2,4,-1,5,7,5,4,2,-1,0,-1],
      bass: [0,-1,0,-1,4,-1,4,-1,5,-1,5,-1,4,-1,0,-1],

      melody: [7,-1,4,-1,5,-1,2,-1,4,-1,0,-1,2,-1,-1,-1,9,-1,7,-1,5,-1,4,-1,2,4,0,-1,2,-1,0,-1],
      bass: [0,-1,-1,4,5,-1,-1,4,0,-1,2,-1,0,-1,4,-1],

      bass: [0,0,4,4,5,5,7,4,0,0,5,4,2,4,0,0],

  function degFreq(deg, oct, root) {
    if (deg < 0) return 0;
    const major = [0, 2, 4, 5, 7, 9, 11];
    const st = major[deg % 7] + 12 * Math.floor(deg / 7) + (oct || 0) * 12;
    return (root || 174.61) * Math.pow(2, st / 12);
  }
  function pickSong(avoid) {
    if (SONGS.length < 2) return 0;
    let i = avoid;
    while (i === avoid) i = (Math.random() * SONGS.length) | 0;
    return i;
  }
  function tone(freq, dur, type, vol, when) {
    if (!freq || !musicOn) return;
    try {
      const a = audio();
      const t = when || a.currentTime;
      const o = a.createOscillator();
      const g = a.createGain();
      o.type = type;
      o.frequency.setValueAtTime(freq, t);
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(vol, t + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.connect(g); g.connect(a.destination);
      o.start(t); o.stop(t + dur + 0.02);
    } catch (e) {}
  }
  function startMusic() {
    music.playing = true;
    music.step = 0;
    music.song = pickSong(-1);
    try { music.next = audio().currentTime + 0.05; } catch (e) { music.next = 0; }
  }
  function stopMusic() { music.playing = false; }
  function tickMusic() {
    if (!music.playing || !musicOn) return;
    try {
      const a = audio();
      const now = a.currentTime;
      const song = SONGS[music.song] || SONGS[0];
      while (music.next < now + 0.25) {
        if (music.step >= song.melody.length) {
          music.song = pickSong(music.song);
          music.step = 0;
        }
        const track = SONGS[music.song];
        const i = music.step;
        const m = track.melody[i];
        const b = track.bass[i % track.bass.length];
        if (m >= 0) {
          tone(degFreq(m, 1, track.root), track.beat * 1.4, "sine", 0.042, music.next);
          tone(degFreq(m, 1, track.root) * 2, track.beat, "triangle", 0.01, music.next);
        }
        if (b >= 0) {
          tone(degFreq(b, 0, track.root), track.beat * 2.1, "sine", 0.028, music.next);
          tone(degFreq(b + 4, 0, track.root), track.beat * 1.8, "sine", 0.01, music.next);
        }
        music.step += 1;
        music.next += track.beat;
      }
    } catch (e) {}
  }

  function spawnCar() {
    const used = new Set(state.cars.filter(c => c.y < 160).map(c => c.lane));
    const free = [];
    for (let i = 0; i < LANES; i++) if (!used.has(i)) free.push(i);
    if (!free.length) return;
    // keep at least one gap in nearby traffic
    const lane = pick(free);
    const kind = Math.random();
    const tall = kind > 0.82;
    state.cars.push({
      lane,
      x: laneX(lane),
      y: -80,
      w: tall ? 40 : 34,
      h: tall ? 72 : 54,
      vy: state.speed * rand(0.35, 0.72),
      color: pick(CAR_COLORS.filter(c => c !== "#7cffb2")),
      passed: false,
      near: false,
    });
  }

  function spawnCoin() {
    const occupied = new Set(state.cars.filter(c => c.y < 120).map(c => c.lane));
    const free = [];
    for (let i = 0; i < LANES; i++) if (!occupied.has(i)) free.push(i);
    if (!free.length) return;

    state.coins.push({

    });

  function renderShop(msg) {
    document.getElementById("shop-bank").textContent = `Bank: ${formatPts(save.bank)}   ·   Multiplier x${multiplier().toFixed(1)}`;
    document.getElementById("shop-msg").textContent = msg || "";
    const nextLv = save.multLv + 1;
    const maxed = save.multLv >= MAX_MULT_LV;
    const cost = maxed ? 0 : multCost(save.multLv);
    const nextMult = 1 + nextLv * 0.1;
    document.getElementById("shop-mult").innerHTML = maxed
      ? `<div class="shop-item owned selected"><div class="info"><b>Max multiplier</b><span>You own x${multiplier().toFixed(1)}</span></div><div class="price">MAX</div></div>`
      : `<div class="shop-item" id="buy-mult"><div class="info"><b>Upgrade to x${nextMult.toFixed(1)}</b><span>Now x${multiplier().toFixed(1)} · each buy is +0.1</span></div><div class="price">${formatPts(cost)}</div></div>`;
    const hold = document.getElementById("shop-skins");
    hold.innerHTML = "";
    for (const skin of SKINS) {
      const owned = save.owned.includes(skin.id);
      const selected = save.skin === skin.id;
      const el = document.createElement("div");
      el.className = "shop-item" + (owned ? " owned" : "") + (selected ? " selected" : "");
      el.dataset.skin = skin.id;
      const sw = document.createElement("div");

        ? "linear-gradient(180deg,#ff4d6d,#ffd166,#7cffb2,#4cc9f0,#c77dff)"
        : skin.color;
      const info = document.createElement("div");
      info.className = "info";
      info.innerHTML = `<b>${skin.name}</b><span>${owned ? (selected ? "Equipped" : "Owned · tap to equip") : "Unlock this look"}</span>`;
      const price = document.createElement("div");
      price.className = "price";
      price.textContent = owned ? (selected ? "ON" : "USE") : formatPts(skin.price);
      el.appendChild(sw); el.appendChild(info); el.appendChild(price);
      hold.appendChild(el);
    }
    const buy = document.getElementById("buy-mult");
    if (buy) buy.onclick = () => {
      if (save.bank < cost) { renderShop("Not enough points yet. Keep racing!"); return; }
      save.bank -= cost;
      save.stats.spent += cost;
      save.multLv += 1;
      persist();
      refreshBankHud();
      beep(660, 0.1, "sine", 0.06, 990);
      renderShop(`Multiplier is now x${multiplier().toFixed(1)}!`);
    };
    hold.querySelectorAll(".shop-item").forEach((el) => {
      el.onclick = () => {
        const skin = SKINS.find(s => s.id === el.dataset.skin);

        if (save.owned.includes(skin.id)) {
          save.skin = skin.id;
          persist();

        save.stats.spent += skin.price;
        save.owned.push(skin.id);
        save.skin = skin.id;
        persist();
        refreshBankHud();
        beep(700, 0.12, "sine", 0.06, 1100);
        renderShop(`Unlocked ${skin.name}!`);
      };
    });

  document.getElementById("shop-back").addEventListener("click", (e) => {
    e.preventDefault();
    e.stopPropagation();
    showMenu();
  });
  document.getElementById("stats-btn").addEventListener("click", (e) => {
    e.preventDefault();
    e.stopPropagation();
    showStats();
  });
  document.getElementById("stats-btn-go").addEventListener("click", (e) => {
    e.preventDefault();
    e.stopPropagation();
    showStats();
  });
  document.getElementById("stats-back").addEventListener("click", (e) => {
    e.preventDefault();
    e.stopPropagation();
    showMenu();
  });
  document.getElementById("garage-btn").addEventListener("click", (e) => {
    e.preventDefault();
    e.stopPropagation();
    showGarage();
  });
  document.getElementById("garage-back").addEventListener("click", (e) => {
    e.preventDefault();
    e.stopPropagation();
    showMenu();
  });
  document.getElementById("daily-btn").addEventListener("click", (e) => {
    e.preventDefault();
    e.stopPropagation();
    claimDaily();
  });
  document.getElementById("code-go").addEventListener("click", (e) => {
    e.preventDefault();
    e.stopPropagation();
    tryCode();
  });
  document.getElementById("code-in").addEventListener("keydown", (e) => {
    if (e.code === "Enter") {
      e.preventDefault();
      e.stopPropagation();
      tryCode();
    }
  });
  document.querySelectorAll("#name-panel button[data-slot]").forEach((btn) => {
    btn.addEventListener("click", (e) => {
      e.preventDefault();
      e.stopPropagation();
      nudgeLetter(Number(btn.dataset.slot), Number(btn.dataset.dir));
    });
  });
  document.getElementById("name-save").addEventListener("click", (e) => {
    e.preventDefault();
    e.stopPropagation();
    submitName();
  });
  document.getElementById("music-btn").addEventListener("click", (e) => {
    e.preventDefault();
    e.stopPropagation();
    musicOn = !musicOn;
    localStorage.setItem("turboLanesMusic", musicOn ? "on" : "off");
    syncMusicBtn();
    if (musicOn) startMusic();
    else stopMusic();
  });
  syncMusicBtn();

  window.addEventListener("keydown", (e) => {
    if (state.mode === "name") {
      if (e.code === "ArrowLeft") { nameState.slot = (nameState.slot + 2) % 3; paintNameSlots(); e.preventDefault(); return; }
      if (e.code === "ArrowRight") { nameState.slot = (nameState.slot + 1) % 3; paintNameSlots(); e.preventDefault(); return; }
      if (e.code === "ArrowUp") { nudgeLetter(nameState.slot, 1); e.preventDefault(); return; }
      if (e.code === "ArrowDown") { nudgeLetter(nameState.slot, -1); e.preventDefault(); return; }
      if (e.key && /^[a-zA-Z0-9]$/.test(e.key)) {
        nameState.letters[nameState.slot] = e.key.toUpperCase();
        nameState.slot = Math.min(2, nameState.slot + 1);
        paintNameSlots();
        e.preventDefault();
        return;
      }
      if (e.code === "Backspace") {
        nameState.letters[nameState.slot] = "A";
        nameState.slot = Math.max(0, nameState.slot - 1);
        paintNameSlots();
        e.preventDefault();
        return;
      }
      if (e.code === "Enter") { e.preventDefault(); submitName(); return; }
      return;
    }
    if (state.mode === "stats") {
      if (e.code === "Escape") showMenu();
      return;
    }
    if (e.code === "ArrowLeft" || e.code === "KeyA") keys.l = true;
    if (e.code === "ArrowRight" || e.code === "KeyD") keys.r = true;
    if (e.code === "ArrowUp" || e.code === "KeyW" || e.code === "Space") keys.u = true;
    if ((e.code === "Enter" || e.code === "Space") && (state.mode === "menu" || state.mode === "over")) {
      e.preventDefault();
      start();
    }
    if (e.code === "Escape" && (state.mode === "shop" || state.mode === "stats" || state.mode === "garage")) showMenu();
  });
  window.addEventListener("keyup", (e) => {
    if (e.code === "ArrowLeft" || e.code === "KeyA") keys.l = false;
    if (e.code === "ArrowRight" || e.code === "KeyD") keys.r = false;
    if (e.code === "ArrowUp" || e.code === "KeyW" || e.code === "Space") keys.u = false;
  });

  function update(dt) {
    tickMusic();
    state.t += dt;
    if (state.shake > 0) state.shake = Math.max(0, state.shake - dt * 28);
    if (state.flash > 0) state.flash = Math.max(0, state.flash - dt * 2.2);
    if (state.comboT > 0) {
      state.comboT -= dt;
      if (state.comboT <= 0) { state.combo = 0; comboEl.textContent = ""; }
    }

    // trees always drift a little on menu too
    const scroll = (state.mode === "play" ? state.speed : 90) * dt;
    for (const tr of state.trees) {
      tr.y += scroll * 0.55;
      if (tr.y > H + 50) {
        const KINDS = ["tree", "tree", "bush", "rock", "sign", "lamp", "flower"];
        tr.y = -70;
        tr.s = rand(0.7, 1.25);
        tr.side = Math.random() < 0.5 ? 0 : 1;
        tr.kind = KINDS[(Math.random() * KINDS.length) | 0];
        tr.hue = rand(90, 150);
      }
    }

    if (state.mode !== "play") {
      state.roadOff += 90 * dt;
      return;
    }

    const p = state.player;
    if (p.inv > 0) p.inv -= dt;

    // speed curve — ramps forever, stays fair
    state.baseSpeed = 280 + state.dist * 0.085 + Math.min(220, state.t * 6);
    if (keys.u) state.boost = Math.min(1, state.boost + dt * 1.8);
    else state.boost = Math.max(0, state.boost - dt * 2.4);
    state.speed = state.baseSpeed * (1 + state.boost * 0.55);

    state.dist += state.speed * dt;
    state.roadOff += state.speed * dt;
    const mult = multiplier();
    state.score += (state.speed * 0.035 + state.combo * 4) * dt * mult;
    scoreEl.textContent = String(Math.floor(state.score));
    if (p.skin) p.color = skinColor(p.skin, state.t);

    // steering — snap-to-lane with a short cooldown so holding works
    state.laneCool -= dt;
    if (state.laneCool <= 0) {
      if (keys.l && !keys.r && p.lane > 0) {
        p.lane -= 1;
        state.laneCool = 0.16;
        beep(320, 0.05, "sine", 0.03);
      } else if (keys.r && !keys.l && p.lane < LANES - 1) {
        p.lane += 1;
        state.laneCool = 0.16;
        beep(380, 0.05, "sine", 0.03);
      }
    }
    const tx = laneX(p.lane);
    p.x += (tx - p.x) * Math.min(1, dt * 14);

    // spawn traffic denser over time
    state.spawnT -= dt;
    const spawnEvery = Math.max(0.28, 0.85 - state.t * 0.012);
    if (state.spawnT <= 0) {
      spawnCar();
      if (Math.random() < 0.35) spawnCar();
      state.spawnT = spawnEvery * rand(0.7, 1.15);
    }
    state.coinT -= dt;
    if (state.coinT <= 0) {
      spawnCoin();
      state.coinT = rand(0.7, 1.6);
    }

    for (const c of state.cars) {
      c.y += (state.speed - c.vy * 0.15) * dt * 0.92 + c.vy * dt * 0.25;
      // keep aligned to lane
      c.x += (laneX(c.lane) - c.x) * 0.2;

      if (!c.passed && c.y > p.y + p.h * 0.2) {
        c.passed = true;
        state.score += (8 + state.combo * 2) * multiplier();
      }
      // near miss
      if (!c.near && Math.abs(c.y - p.y) < 50) {
        const dx = Math.abs(c.x - p.x);
        if (dx > (c.w + p.w) * 0.48 && dx < LANE_W * 0.95) {
          c.near = true;
          state.combo += 1;
          save.stats.near += 1;
          state.comboT = 2.1;
          state.score += 20 * state.combo * multiplier();
          comboEl.textContent = state.combo > 1 ? `NEAR MISS ×${state.combo}` : "NEAR MISS!";
          beep(520 + state.combo * 40, 0.09, "triangle", 0.05, 880);
          burst((c.x + p.x) / 2, p.y, "#fff", 8, 140);
        }
      }

      // collision
      if (p.inv <= 0 && Math.abs(c.x - p.x) < (c.w + p.w) * 0.42 && Math.abs(c.y - p.y) < (c.h + p.h) * 0.42) {
        gameOver();
        return;
      }
    }
    state.cars = state.cars.filter(c => c.y < H + 90);

    for (const k of state.coins) {
      k.y += state.speed * dt;
      k.spin += dt * 6;
      if (Math.abs(k.x - p.x) < 28 && Math.abs(k.y - p.y) < 36 && !k.grabbed) {
        k.grabbed = true;
        save.stats.coins += 1;
        const gain = Math.floor((40 + state.combo * 10) * multiplier());
        state.score += gain;
        state.floats.push({ x: k.x, y: k.y, text: "+" + gain, life: 0.8 });
        beep(880, 0.1, "sine", 0.06, 1320);
        burst(k.x, k.y, "#ffd166", 12, 180);
      }
    }
    state.coins = state.coins.filter(k => !k.grabbed && k.y < H + 30);

    for (const fl of state.floats) {
      fl.y -= 38 * dt;
      fl.life -= dt;
    }
    state.floats = state.floats.filter(fl => fl.life > 0);

    for (const pt of state.parts) {
      pt.x += pt.vx * dt;
      pt.y += pt.vy * dt + state.speed * dt * 0.15;
      pt.vy += 40 * dt;
      pt.life -= dt;
    }
    state.parts = state.parts.filter(pt => pt.life > 0);

    if (state.boost > 0.2) {
      burst(p.x + rand(-8, 8), p.y + p.h * 0.45, "#7cffb2", 1, 40);
    }
  }

  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function drawCar(x, y, w, h, color, player) {
    ctx.save();
    ctx.translate(x, y);
    // shadow
    ctx.fillStyle = "rgba(0,0,0,0.35)";
    ctx.beginPath();
    ctx.ellipse(0, h * 0.48, w * 0.55, 7, 0, 0, Math.PI * 2);
    ctx.fill();

    // body
    ctx.fillStyle = color;
    roundRect(-w / 2, -h / 2, w, h, 8);
    ctx.fill();
    // darker bottom
    ctx.fillStyle = "rgba(0,0,0,0.18)";
    roundRect(-w / 2, 4, w, h / 2 - 4, 6);
    ctx.fill();

    // cabin
    ctx.fillStyle = player ? "rgba(220,255,240,0.85)" : "rgba(30,40,70,0.55)";
    roundRect(-w * 0.32, -h * 0.28, w * 0.64, h * 0.32, 5);
    ctx.fill();

    // headlights / taillights
    ctx.fillStyle = player ? "#fff6b0" : "#ff6b6b";
    ctx.fillRect(-w * 0.36, h * 0.32, w * 0.18, 5);
    ctx.fillRect(w * 0.18, h * 0.32, w * 0.18, 5);
    ctx.fillStyle = player ? (state.player.color || "#7cffb2") : "#ffe08a";
    ctx.fillRect(-w * 0.36, -h * 0.46, w * 0.18, 5);
    ctx.fillRect(w * 0.18, -h * 0.46, w * 0.18, 5);

    // stripe
    ctx.fillStyle = player && state.player && state.player.skin
      ? state.player.skin.stripe
      : "rgba(255,255,255,0.28)";
    ctx.fillRect(-3, -h * 0.42, 6, h * 0.28);

    if (player && state.boost > 0.15) {
      ctx.fillStyle = `rgba(124,255,178,${0.35 + state.boost * 0.4})`;
      ctx.beginPath();
      ctx.moveTo(-8, h * 0.5);
      ctx.lineTo(0, h * 0.5 + 16 + state.boost * 18);
      ctx.lineTo(8, h * 0.5);
      ctx.fill();
    }
    ctx.restore();
  }

  function drawTree(tr) {
    const x = tr.side === 0 ? randish(tr, 22) : W - randish(tr, 22);
    const y = tr.y;
    ctx.save();
    ctx.translate(x, y);
    ctx.scale(tr.s, tr.s);
    const kind = tr.kind || "tree";
    if (kind === "bush") {
      ctx.fillStyle = `hsl(${tr.hue}, 50%, 32%)`;
      ctx.beginPath(); ctx.ellipse(0, 10, 16, 10, 0, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = `hsl(${tr.hue}, 55%, 42%)`;
      ctx.beginPath(); ctx.ellipse(-6, 6, 9, 7, 0, 0, Math.PI * 2); ctx.fill();
    } else if (kind === "rock") {
      ctx.fillStyle = "#6b7280";
      ctx.beginPath(); ctx.ellipse(0, 12, 12, 7, 0, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = "#9aa3b2";
      ctx.beginPath(); ctx.ellipse(-3, 10, 6, 4, 0, 0, Math.PI * 2); ctx.fill();
    } else if (kind === "sign") {
      ctx.fillStyle = "#5a3a22";
      ctx.fillRect(-2, 0, 4, 22);
      ctx.fillStyle = "#2f9e44";
      ctx.fillRect(-12, -8, 24, 16);
      ctx.fillStyle = "#fff";
      ctx.fillRect(-8, -2, 16, 3);
    } else if (kind === "lamp") {
      ctx.fillStyle = "#3d4454";
      ctx.fillRect(-2, -8, 4, 28);
      ctx.fillStyle = "#f4e27a";
      ctx.beginPath(); ctx.arc(0, -12, 6, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = "rgba(244,226,122,0.2)";
      ctx.beginPath(); ctx.arc(0, -12, 14, 0, Math.PI * 2); ctx.fill();
    } else if (kind === "flower") {
      ctx.fillStyle = "#2f9e44";
      ctx.fillRect(-1, 8, 2, 10);
      ctx.fillStyle = "#ffd166";
      ctx.beginPath(); ctx.arc(0, 6, 4, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = "#ff6b6b";
      for (let i = 0; i < 5; i++) {
        const a = i * 1.26;
        ctx.beginPath(); ctx.arc(Math.cos(a) * 5, 6 + Math.sin(a) * 5, 2.2, 0, Math.PI * 2); ctx.fill();
      }
    } else {
      ctx.fillStyle = "#5a3a22";
      ctx.fillRect(-3, 8, 6, 16);
      ctx.fillStyle = `hsl(${tr.hue}, 55%, 38%)`;
      ctx.beginPath(); ctx.arc(0, 0, 14, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = `hsl(${tr.hue}, 60%, 48%)`;
      ctx.beginPath(); ctx.arc(-6, -4, 9, 0, Math.PI * 2); ctx.fill();
    }
    ctx.restore();
  }
  function randish(tr, base) {
    // stable-ish x from y so trees don't jitter
    return base + ((Math.sin(tr.y * 0.01 + tr.s * 9) + 1) * 8);
  }

  function draw() {
    const shx = state.shake ? (Math.random() - 0.5) * state.shake : 0;
    const shy = state.shake ? (Math.random() - 0.5) * state.shake : 0;
    ctx.setTransform(1, 0, 0, 1, shx, shy);

    // sky
    const g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, "#1b2a5a");
    g.addColorStop(0.45, "#243056");
    g.addColorStop(1, "#14182a");
    ctx.fillStyle = g;
    ctx.fillRect(-20, -20, W + 40, H + 40);

    // distant hills
    ctx.fillStyle = "#1a2744";
    ctx.beginPath();
    ctx.moveTo(-20, 210);
    for (let x = 0; x <= W; x += 20) {
      ctx.lineTo(x, 170 + Math.sin(x * 0.03 + state.t * 0.2) * 10);
    }
    ctx.lineTo(W + 20, 240); ctx.lineTo(-20, 240); ctx.fill();

    // grass
    ctx.fillStyle = "#1d6b3a";
    ctx.fillRect(0, 0, ROAD_L - 8, H);
    ctx.fillStyle = "#185c32";
    ctx.fillRect(ROAD_R + 8, 0, W - ROAD_R, H);

    // darker grass edge
    ctx.fillStyle = "#0f3d20";
    ctx.fillRect(ROAD_L - 14, 0, 8, H);
    ctx.fillRect(ROAD_R + 6, 0, 8, H);

    for (const tr of state.trees) drawTree(tr);

    // road
    ctx.fillStyle = "#2b3144";
    ctx.fillRect(ROAD_L - 6, -20, ROAD_W + 12, H + 40);

    // red/white curb
    const curbH = 18;
    for (let y = -((state.roadOff * 0.4) % (curbH * 2)); y < H + 20; y += curbH * 2) {
      ctx.fillStyle = "#f2f2f2";
      ctx.fillRect(ROAD_L - 6, y, 6, curbH);
      ctx.fillRect(ROAD_R, y, 6, curbH);
      ctx.fillStyle = "#e63946";
      ctx.fillRect(ROAD_L - 6, y + curbH, 6, curbH);
      ctx.fillRect(ROAD_R, y + curbH, 6, curbH);
    }

    // lane dashes
    ctx.fillStyle = "#f4e27a";
    const dash = 28, gap = 22, period = dash + gap;
    const off = state.roadOff % period;
    for (let i = 1; i < LANES; i++) {
      const x = ROAD_L + LANE_W * i;
      for (let y = -off; y < H + period; y += period) {
        ctx.fillRect(x - 2, y, 4, dash);
      }
    }

    // coins
    for (const k of state.coins) {
      ctx.save();
      ctx.translate(k.x, k.y);
      ctx.scale(Math.cos(k.spin) * 0.35 + 0.65, 1);
      ctx.fillStyle = "#ffd166";
      ctx.beginPath(); ctx.arc(0, 0, k.r, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = "#ffe9a6";
      ctx.beginPath(); ctx.arc(-3, -3, k.r * 0.45, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = "#c79212";
      ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(0, 0, k.r - 2, 0, Math.PI * 2); ctx.stroke();
      ctx.restore();
    }

    // traffic
    const sorted = state.cars.slice().sort((a, b) => a.y - b.y);
    for (const c of sorted) drawCar(c.x, c.y, c.w, c.h, c.color, false);

    if (state.mode === "play" || state.mode === "over") {
      const p = state.player;
      if (state.mode === "play") drawCar(p.x, p.y, p.w, p.h, p.color, true);
    }

    ctx.font = "bold 16px Trebuchet MS";
    ctx.textAlign = "center";
    for (const fl of state.floats) {
      ctx.globalAlpha = Math.max(0, fl.life / 0.8);
      ctx.fillStyle = "#ffd166";
      ctx.strokeStyle = "rgba(0,0,0,0.45)";
      ctx.lineWidth = 3;
      ctx.strokeText(fl.text, fl.x, fl.y);
      ctx.fillText(fl.text, fl.x, fl.y);
    }
    ctx.globalAlpha = 1;
    ctx.textAlign = "left";

    // particles
    for (const pt of state.parts) {
      ctx.globalAlpha = Math.max(0, pt.life / pt.max);
      ctx.fillStyle = pt.color;
      ctx.fillRect(pt.x, pt.y, pt.size, pt.size);
    }
    ctx.globalAlpha = 1;

    // speed lines when boosting
    if (state.mode === "play" && state.boost > 0.2) {
      ctx.strokeStyle = `rgba(255,255,255,${state.boost * 0.25})`;
      ctx.lineWidth = 2;
      for (let i = 0; i < 10; i++) {
        const x = ROAD_L + Math.random() * ROAD_W;
        const y = Math.random() * H;
        ctx.beginPath();
        ctx.moveTo(x, y);
        ctx.lineTo(x, y + 18 + state.boost * 24);
        ctx.stroke();
      }
    }

    // boost meter
    if (state.mode === "play") {
      ctx.fillStyle = "rgba(0,0,0,0.35)";
      roundRect(16, H - 28, 120, 10, 5); ctx.fill();
      ctx.fillStyle = state.boost > 0.7 ? "#ffd166" : "#7cffb2";
      roundRect(16, H - 28, 120 * state.boost, 10, 5); ctx.fill();
      ctx.fillStyle = "rgba(255,255,255,0.7)";
      ctx.font = "10px Trebuchet MS";
      ctx.fillText("BOOST", 16, H - 32);
    }

    if (state.flash > 0) {
      ctx.fillStyle = `rgba(255,255,255,${state.flash * 0.55})`;
      ctx.fillRect(-20, -20, W + 40, H + 40);
    }

    ctx.setTransform(1, 0, 0, 1, 0, 0);
  }

  let last = performance.now();
  function loop(now) {
    const dt = Math.min(0.033, (now - last) / 1000);
    last = now;
    update(dt);
    draw();
    requestAnimationFrame(loop);
  }
  resetGame();
  requestAnimationFrame(loop);
})();
</script>
